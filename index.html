<style>
  :root{
    --bg:#EFEDE2;
    --surface:#FBFAF5;
    --surface-2:#E6E2D2;
    --ink:#22271E;
    --ink-soft:#5C6156;
    --ink-faint:#8B8E80;
    --accent:#2B6E58;
    --accent-ink:#F4FBF7;
    --accent-soft:#DCEAE3;
    --line:#DAD5C2;
    --warn:#B5762B;
    --warn-soft:#F3E4CC;
    --danger:#AE3F3F;
    --danger-soft:#F2DCDC;
    --good:#2B6E58;
    --shadow:0 1px 2px rgba(30,26,10,.06), 0 8px 24px rgba(30,26,10,.08);

    --cat-1:#2B6E58; --cat-2:#B5762B; --cat-3:#A5533F; --cat-4:#4C6C93;
    --cat-5:#7C5A8C; --cat-6:#7A7C3D; --cat-7:#8C6239; --cat-8:#5C7A7A;

    /* Series de la gráfica: validadas para daltonismo y contraste sobre la tarjeta */
    --serie-gasto:#A75B14; --serie-ahorro:#1C7F5A;

    --font-display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F;
      --surface:#1B2117;
      --surface-2:#242B1D;
      --ink:#EEEBE0;
      --ink-soft:#AAAE9C;
      --ink-faint:#767A6A;
      --accent:#5FBE9C;
      --accent-ink:#0E1A15;
      --accent-soft:#203129;
      --line:#333A29;
      --warn:#E0A455;
      --warn-soft:#332A18;
      --danger:#E07272;
      --danger-soft:#332020;
      --good:#5FBE9C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --cat-1:#5FBE9C; --cat-2:#E0A455; --cat-3:#D98567; --cat-4:#8AA9D6;
      --cat-5:#B98FCB; --cat-6:#B9BC6E; --cat-7:#C79A69; --cat-8:#9AC0C0;
      --serie-gasto:#C2762A; --serie-ahorro:#2C9A88;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F;
    --surface:#1B2117;
    --surface-2:#242B1D;
    --ink:#EEEBE0;
    --ink-soft:#AAAE9C;
    --ink-faint:#767A6A;
    --accent:#5FBE9C;
    --accent-ink:#0E1A15;
    --accent-soft:#203129;
    --line:#333A29;
    --warn:#E0A455;
    --warn-soft:#332A18;
    --danger:#E07272;
    --danger-soft:#332020;
    --good:#5FBE9C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --cat-1:#5FBE9C; --cat-2:#E0A455; --cat-3:#D98567; --cat-4:#8AA9D6;
    --cat-5:#B98FCB; --cat-6:#B9BC6E; --cat-7:#C79A69; --cat-8:#9AC0C0;
    --serie-gasto:#C2762A; --serie-ahorro:#2C9A88;
  }

  *{box-sizing:border-box;}
  /* Los campos en flex no se encogen por su ancho intrínseco: esto lo evita */
  input,select,textarea{max-width:100%; min-width:0;}
  html,body{margin:0;padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.45;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  /* 16px evita que iOS haga zoom al enfocar un campo */
  input,select,textarea{font-family:inherit;font-size:16px;}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  .tnum{font-variant-numeric:tabular-nums;}

  .shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:560px){
    body{padding:28px 16px;}
    .shell{
      min-height:calc(100vh - 56px);
      min-height:calc(100dvh - 56px);
      border-radius:22px;
      box-shadow:var(--shadow);
      border:1px solid var(--line);
      overflow:hidden;
    }
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:calc(16px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  @media (min-width:560px){
    .topbar{padding-top:16px;}
  }
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:1.15rem; font-weight:600;}
  .brand .mark{font-size:1.25rem;}
  .profile-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line); border-radius:999px;
    padding:8px 12px 8px 14px; font-size:.85rem; font-weight:600;
    cursor:pointer; max-width:52%; min-height:40px;
  }
  .profile-pill:active{background:var(--line);}
  .profile-pill span.name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .profile-pill .caret{color:var(--ink-faint); font-size:.7rem;}

  .view{
    flex:1; padding:16px 18px 40px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  .tabbar{
    position:sticky; bottom:0; z-index:5;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  }
  .tabbar button{
    background:none; border:none; color:var(--ink-faint);
    font-size:.72rem; font-weight:600; letter-spacing:.02em;
    padding:10px 4px 8px; border-radius:12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:52px;
  }
  .tabbar button:active{background:var(--surface-2);}
  .tabbar button .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  @media (max-width:360px){
    .tabbar button{font-size:.66rem; padding-left:2px; padding-right:2px;}
  }
  .tabbar button.active{color:var(--accent);}
  .tabbar button.active .dot{background:var(--accent);}

  .card{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
  }
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  .eyebrow{
    font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .headline{
    font-family:var(--font-display); font-size:2.1rem; font-weight:600; line-height:1.1;
  }
  .sub{color:var(--ink-soft); font-size:.85rem;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:12px; padding:11px 16px;
    font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .btn.secondary{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn.block{width:100%;}
  .btn.small{padding:7px 12px; font-size:.8rem; border-radius:10px;}
  .btn.ghost{background:none; border:1px dashed var(--line); color:var(--ink-soft);}
  .btn{min-height:46px;}
  .btn:active{transform:scale(.985); filter:brightness(.96);}
  .btn.small{min-height:38px;}
  @media (prefers-reduced-motion: reduce){ .btn:active{transform:none;} }
  .icon-btn{
    background:none; border:none; color:var(--ink-faint); cursor:pointer;
    font-size:1rem; padding:0; border-radius:10px; line-height:1;
    min-width:40px; min-height:40px;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{color:var(--danger);}
  .icon-btn:active{background:var(--surface-2); color:var(--danger);}

  label.field{display:flex; flex-direction:column; gap:6px; font-size:.8rem; color:var(--ink-soft); font-weight:600;}
  label.field input, label.field select, label.field textarea{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--ink); font-size:1rem;
  }
  label.field textarea{resize:vertical; min-height:60px;}

  .section-title{
    font-family:var(--font-display); font-size:1.05rem; font-weight:600;
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .catrow{
    display:grid; grid-template-columns:10px minmax(0,1fr) 96px 44px 40px;
    align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);
  }
  .catrow-head{
    display:grid; grid-template-columns:10px minmax(0,1fr) 96px 44px 40px;
    gap:8px; margin-top:14px; padding-bottom:4px;
    font-size:.66rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); border-bottom:1px solid var(--line);
  }
  .catrow-head span:nth-child(3){text-align:center;}
  .catrow-head span:nth-child(4){text-align:right;}
  .catrow:last-child{border-bottom:none;}
  .catdot{width:10px;height:10px;border-radius:50%;}
  .catrow input.cat-name{
    background:none; border:none; border-bottom:1px solid transparent; color:var(--ink);
    font-weight:600; padding:2px 0; width:100%;
  }
  .catrow input.cat-name:focus{border-bottom-color:var(--accent);}
  .catrow input.cat-amount{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:6px 6px; text-align:right; width:100%;
    color:var(--ink); font-weight:700; font-family:var(--font-mono); font-size:.85rem;
  }
  .catrow .catamt{font-family:var(--font-mono); font-size:.8rem; text-align:right; white-space:nowrap;}

  /* Solo en pantallas muy angostas la fila pasa a dos líneas, para que el nombre se lea */
  @media (max-width:360px){
    .catrow{
      grid-template-columns:10px minmax(0,1fr) 44px 40px;
      grid-template-areas:
        "dot nombre nombre borrar"
        "dot monto  pct    borrar";
      row-gap:6px;
    }
    .catrow-head{display:none;}
    .catrow .catdot{grid-area:dot; align-self:center;}
    .catrow .cat-name{grid-area:nombre;}
    .catrow input.cat-amount{grid-area:monto; width:100%;}
    .catrow .catamt{grid-area:pct;}
    .catrow .icon-btn{grid-area:borrar; align-self:center;}
  }

  .allocbar{height:10px; border-radius:999px; overflow:hidden; display:flex; background:var(--line);}
  .allocbar span{height:100%;}
  .pcttotal{display:flex; align-items:center; justify-content:space-between; font-size:.8rem; font-weight:700; margin-top:8px;}
  .pcttotal.ok{color:var(--good);}
  .pcttotal.warn{color:var(--warn);}

  .progress{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
  .progress > span{display:block; height:100%; border-radius:999px;}

  .catcard{padding:12px 0; border-bottom:1px solid var(--line);}
  .catcard:last-child{border-bottom:none;}
  .catcard .row{margin-bottom:6px;}
  .catcard .amounts{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft);}

  .expday{margin-bottom:18px;}
  .expday-label{font-size:.75rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .exprow{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .exprow:last-child{border-bottom:none;}
  .exprow .catdot{flex-shrink:0;}
  .exprow .meta{flex:1; min-width:0;}
  .exprow .cname{font-weight:600; font-size:.9rem;}
  .exprow .note{color:var(--ink-soft); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .exprow .amt{font-family:var(--font-mono); font-weight:600; white-space:nowrap;}

  .monthnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .monthnav button{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; width:32px; height:32px; cursor:pointer;}
  .monthnav .label{font-weight:700; text-transform:capitalize; font-family:var(--font-display); font-size:1.05rem;}

  .empty{text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:.85rem;}

  .fab-row{display:flex; gap:10px; margin-top:16px;}

  .overlay{
    position:fixed; inset:0; background:rgba(10,10,6,.45);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:20;
  }
  @media (min-width:560px){ .overlay{align-items:center;} }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--surface); border-radius:18px 18px 0 0;
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);
  }
  @media (min-width:560px){ .sheet{border-radius:18px; max-height:80vh;} }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-head h3{font-size:1.1rem;}
  .sheet form{display:flex; flex-direction:column; gap:12px;}

  .profitem{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    margin-bottom:8px; cursor:pointer; background:var(--surface);
  }
  .profitem.active{border-color:var(--accent); background:var(--accent-soft);}
  .profitem .pname{font-weight:600;}

  .chartwrap{margin-top:6px;}
  .chartwrap svg{width:100%; height:auto; display:block;}
  .chart-mes{
    font-family:var(--font-body); font-size:10px; fill:var(--ink-faint);
    text-transform:capitalize;
  }
  .chart-eje{font-family:var(--font-mono); font-size:9px; fill:var(--ink-faint);}
  .chart-leyenda{
    display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px;
    font-size:.78rem; color:var(--ink-soft);
  }
  .leg-item{display:inline-flex; align-items:center; gap:6px;}
  .leg-item b{color:var(--ink); font-family:var(--font-mono);}
  .leg-chip{width:10px; height:10px; border-radius:3px; flex-shrink:0;}

  /* ----- dona de distribución ----- */
  .donut-wrap{display:flex; flex-direction:column; gap:14px; align-items:center;}
  .donut-wrap svg{width:190px; height:190px; display:block; flex-shrink:0;}
  .donut-total{
    font-family:var(--font-display); font-size:19px; font-weight:600;
    fill:var(--ink); font-variant-numeric:tabular-nums;
  }
  .donut-sub{font-family:var(--font-body); font-size:10px; fill:var(--ink-faint);}
  .leyenda{width:100%; display:flex; flex-direction:column;}
  .leg-row{
    display:grid; grid-template-columns:10px minmax(0,1fr) 38px auto;
    align-items:center; gap:8px; padding:7px 0;
    border-bottom:1px solid var(--line); font-size:.82rem;
  }
  .leg-row:last-child{border-bottom:none;}
  .leg-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .leg-pct{text-align:right; color:var(--ink-soft); font-weight:700;}
  .leg-val{text-align:right; font-family:var(--font-mono); font-size:.78rem;}
  @media (min-width:420px){
    .donut-wrap{flex-direction:row; align-items:center; gap:18px;}
    .donut-wrap svg{width:170px; height:170px;}
  }

  /* ----- metas ----- */
  .goal{padding:12px 0; border-bottom:1px solid var(--line);}
  .goal:first-child{padding-top:0;}
  .goal:last-child{border-bottom:none; padding-bottom:0;}
  .goal .row{margin-bottom:8px;}
  .goal-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .goal .amounts{font-family:var(--font-mono); font-size:.75rem; color:var(--ink-soft);}

  /* ----- tipos de ahorro ----- */
  .hold{padding:14px 0; border-bottom:1px solid var(--line);}
  .hold:first-child{padding-top:0;}
  .hold:last-child{border-bottom:none; padding-bottom:0;}
  .hold-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hold-kind{font-size:.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
  .hold-total{font-family:var(--font-mono); font-weight:700; font-size:.95rem; white-space:nowrap;}
  .hold-grid{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    gap:8px 12px; margin-top:10px;
  }
  .hold-grid > div{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .hold-k{font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
  .hold-v{font-size:.85rem; font-weight:600;}
  .hold-v.pos{color:var(--good);}
  .hold-v.neg{color:var(--danger);}
  .pos{color:var(--good);} .neg{color:var(--danger);}
  .hold-foot{
    margin-top:10px; padding-top:8px; border-top:1px dashed var(--line);
    font-size:.75rem; color:var(--ink-soft);
  }
  .kind-fields{gap:12px;}
  .hold-native{
    font-size:.72rem; color:var(--ink-faint); font-family:var(--font-mono);
    white-space:nowrap; margin-top:1px;

<div class="shell" id="shell"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var LS_KEY = "cuadre_v1";
  var CAT_COLORS = 8;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function ymKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function ymAdd(ym, delta){
    var parts = ym.split("-"); var y = Number(parts[0]); var m = Number(parts[1]) - 1;
    var d = new Date(y, m + delta, 1);
    return ymKey(d);
  }
  function monthLabel(ym){
    var parts = ym.split("-"); var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
    var s = new Intl.DateTimeFormat("es", {month:"long", year:"numeric"}).format(d);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dayLabel(dateStr){
    var parts = dateStr.split("-"); var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    var s = new Intl.DateTimeFormat("es", {weekday:"short", day:"numeric", month:"short"}).format(d);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dateShort(dateStr){
    var parts = dateStr.split("-"); var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return new Intl.DateTimeFormat("es", {day:"numeric", month:"short"}).format(d);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Lee números escritos como la gente los escribe aquí: acepta coma o punto
  // como decimal y puntos de miles. "305,57" y "305.57" -> 305.57;
  // "45.000" -> 45000; "1.234,56" -> 1234.56.
  function parseNum(raw){
    if(raw == null) return 0;
    var s = String(raw).trim();
    if(!s) return 0;
    var negativo = /^-/.test(s);
    s = s.replace(/[^\d.,]/g, "");
    if(!s) return 0;

    var ultimoPunto = s.lastIndexOf(".");
    var ultimaComa = s.lastIndexOf(",");
    var corte = Math.max(ultimoPunto, ultimaComa);

    var entero, decimales = "";
    if(corte === -1){
      entero = s;
    } else {
      var despues = s.slice(corte + 1);
      var antes = s.slice(0, corte);
      var otroSeparador = antes.indexOf(corte === ultimoPunto ? "," : ".") !== -1;
      var soloCeros = /^0*$/.test(antes.replace(/[.,]/g, ""));
      // Tres dígitos al final, sin otro separador y con parte entera real:
      // es separador de miles (45.000), no un decimal.
      var esMiles = despues.length === 3 && !otroSeparador && !soloCeros;
      if(esMiles){
        entero = s;
      } else {
        entero = antes;
        decimales = despues;
      }
    }
    entero = entero.replace(/[.,]/g, "");
    decimales = decimales.replace(/[.,]/g, "");
    var n = Number((entero || "0") + (decimales ? "." + decimales : ""));
    if(!isFinite(n)) return 0;
    return negativo ? -n : n;
  }

  // ---------- almacenamiento ----------
  // Algunos visores (incluido el de Claude) bloquean o vacían el almacenamiento
  // del navegador. Si eso pasa, la app sigue funcionando en memoria durante la
  // sesión y avisa que hay que exportar el respaldo antes de cerrar.
  var storageOk = (function(){
    try{
      localStorage.setItem(LS_KEY + "__test", "1");
      localStorage.removeItem(LS_KEY + "__test");
      return true;
    }catch(e){ return false; }
  })();

  function loadDB(){
    if(!storageOk) return {profiles:{}, active:null};
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return {profiles:{}, active:null};
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return {profiles:{}, active:null};
      if(!parsed.profiles) parsed.profiles = {};
      return parsed;
    }catch(e){ return {profiles:{}, active:null}; }
  }
  var DB = loadDB();

  function saveDB(){
    if(!storageOk) return false;
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
      return true;
    }catch(e){
      // El almacenamiento dejó de aceptar escrituras (cuota llena o bloqueado).
      storageOk = false;
      showToast("No se pudieron guardar los cambios en este navegador. Exporta tu respaldo antes de cerrar.");
      return false;
    }
  }

  function seedCategories(){
    return [
      {id:uid(), name:"Vivienda", amount:0, colorIdx:0},
      {id:uid(), name:"Comida", amount:0, colorIdx:1},
      {id:uid(), name:"Transporte", amount:0, colorIdx:2},
      {id:uid(), name:"Ocio", amount:0, colorIdx:3},
      {id:uid(), name:"Ahorro", amount:0, colorIdx:4},
      {id:uid(), name:"Otros", amount:0, colorIdx:5}
    ];
  }

  function createProfile(name){
    var id = uid();
    DB.profiles[id] = {
      id: id, name: name, currency: "$", currencyCode: "COP",
      debts: [],
      budget: 0,
      cycleStartDay: 1,
      catColorSeq: 6,
      categories: seedCategories(),
      expenses: [], savings: [], interest: [],
      incomes: [], recurring: [], recurringDone: {},
      goals: [], holdings: [],
      fxRates: {}, fxUpdatedAt: "",
      createdAt: Date.now()
    };
    DB.active = id;
    saveDB();
    return id;
  }

  // Deja todos los perfiles al día y guarda una sola vez, para que la conversión
  // de porcentajes a montos no se repita en cada carga.
  function migrateAll(){
    Object.keys(DB.profiles).forEach(function(id){
      var p = normalizeProfile(DB.profiles[id]);
      rememberBudget(p);
      applyRecurring(p);
    });
    saveDB();
  }

  // Guarda el presupuesto del mes en curso, para que el historial no cambie
  // cuando más adelante ajustes el monto.
  function rememberBudget(p){
    if(!p) return;
    if(!p.budgetHistory) p.budgetHistory = {};
    var b = Number(p.budget) || 0;
    if(b > 0) p.budgetHistory[ymKey(new Date())] = b;
  }
  // El presupuesto que regía en ese mes (o el actual si no quedó registro)
  function budgetFor(p, ym){
    var h = p.budgetHistory && p.budgetHistory[ym];
    if(h != null && Number(h) > 0) return { valor: Number(h), guardado: true };
    return { valor: Number(p.budget) || 0, guardado: false };
  }

  // Los perfiles creados antes de esta versión no traen metas ni tipos de ahorro.
  function normalizeProfile(p){
    if(!p) return p;
    if(!p.currencyCode) p.currencyCode = "COP";
    if(!p.fxRates || typeof p.fxRates !== "object") p.fxRates = {};
    if(!Array.isArray(p.goals)) p.goals = [];
    if(!Array.isArray(p.holdings)) p.holdings = [];
    if(!Array.isArray(p.debts)) p.debts = [];
    if(!p.budgetHistory || typeof p.budgetHistory !== "object") p.budgetHistory = {};
    if(!(Number(p.cycleStartDay) >= 1)) p.cycleStartDay = 1;
    if(!Array.isArray(p.incomes)) p.incomes = [];
    if(!Array.isArray(p.recurring)) p.recurring = [];
    if(!p.recurringDone || typeof p.recurringDone !== "object") p.recurringDone = {};
    // Antes se asignaba por porcentaje; ahora se asigna el monto directo.
    // Convertimos una sola vez lo que ya tenías.
    if(Array.isArray(p.categories)){
      p.categories.forEach(function(c){
        if(c.amount == null){
          var pct = Number(c.percent) || 0;
          c.amount = (Number(p.budget) > 0) ? (Number(p.budget) * pct / 100) : 0;
        }
      });
    }
    if(!Array.isArray(p.savings)) p.savings = [];
    if(!Array.isArray(p.interest)) p.interest = [];
    if(!Array.isArray(p.expenses)) p.expenses = [];
    if(!Array.isArray(p.categories)) p.categories = [];
    return p;
  }
  function activeProfile(){ return normalizeProfile(DB.profiles[DB.active]); }

  function fmt(p, n){
    var v = Number(n) || 0;
    var neg = v < 0;
    v = Math.round(Math.abs(v));
    var s = v.toLocaleString("es-CO");
    return (neg ? "-" : "") + (p ? p.currency : "$") + s;
  }

  // Igual que fmt, pero conserva los centavos. Se usa en precios por acción y
  // en cifras pequeñas, donde redondear al peso borraría información.
  function fmtDec(p, n, dec){
    var v = Number(n) || 0;
    var neg = v < 0;
    var d = dec == null ? 2 : dec;
    var s = Math.abs(v).toLocaleString("es-CO", {minimumFractionDigits:d, maximumFractionDigits:d});
    return (neg ? "-" : "") + (p ? p.currency : "$") + s;
  }
  // Decide sola: con decimales si la cifra es pequeña y los tiene.
  function fmtSmart(p, n){
    var v = Number(n) || 0;
    if(Math.abs(v) < 1000 && Math.round(v) !== v) return fmtDec(p, v, 2);
    return fmt(p, v);
  }
  // Porcentajes con coma decimal, como el resto de la app.
  function fmtPct(n, dec){
    var v = Number(n) || 0;
    var d = dec == null ? 1 : dec;
    return (Math.round(v) === v ? String(v) : v.toFixed(d)).replace(".", ",");
  }

  function catColor(idx){ return "var(--cat-" + ((idx % CAT_COLORS) + 1) + ")"; }

  // ---------- monedas ----------
  // Una acción puede cotizar en dólares mientras tu presupuesto está en pesos.
  // Guardamos cuántos pesos vale 1 unidad de cada moneda extranjera.
  function isForeign(p, code){
    if(!code) return false;
    return String(code).toUpperCase() !== String(p.currencyCode || "COP").toUpperCase();
  }
  // Devuelve la tasa, o null si es extranjera y todavía no la conocemos.
  function fxRate(p, code){
    if(!isForeign(p, code)) return 1;
    var r = Number(p.fxRates[String(code).toUpperCase()]);
    return (r > 0) ? r : null;
  }
  function fmtNative(code, n, dec){
    var d = dec == null ? 2 : dec;
    var v = Number(n) || 0;
    return v.toLocaleString("es-CO", {minimumFractionDigits:d, maximumFractionDigits:d}) + " " + String(code || "").toUpperCase();
  }

  // ---------- tipos de ahorro ----------
  var KIND_LABEL = { cuenta:"Cuenta / Efectivo", cdt:"CDT", accion:"Acción" };

  function daysBetween(fromStr, to){
    var parts = String(fromStr || "").split("-");
    if(parts.length !== 3) return 0;
    var from = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    var ms = (to || new Date()) - from;
    return Math.max(0, Math.floor(ms / 86400000));
  }

  // Tasa efectiva anual: valor = capital * (1 + tasa)^(días/365)
  function cdtValueAt(h, days){
    var principal = Number(h.principal) || 0;
    var rate = (Number(h.rate) || 0) / 100;
    if(principal <= 0) return 0;
    if(rate <= 0) return principal;
    return principal * Math.pow(1 + rate, days / 365);
  }
  function cdtTermDays(h){ return Math.round((Number(h.termMonths) || 0) * 30.4375); }
  function cdtIsOpen(h){ return !!h.openEnded || !(Number(h.termMonths) > 0); }
  function cdtElapsedDays(h){
    var elapsed = daysBetween(h.startDate);
    if(cdtIsOpen(h)) return elapsed;           // sin plazo: sigue creciendo
    return Math.min(elapsed, cdtTermDays(h));  // con plazo: se detiene al vencer
  }
  // ¿El valor lo escribiste tú a mano?
  function cdtManual(h){ return Number(h.currentValue) > 0; }

  // Valor en la moneda propia del papel (sin convertir)
  function holdingNativeValue(h){
    if(!h) return 0;
    if(h.kind === "cuenta") return Number(h.amount) || 0;
    if(h.kind === "cdt"){
      if(cdtManual(h)) return Number(h.currentValue);
      return cdtValueAt(h, cdtElapsedDays(h));
    }
    if(h.kind === "accion") return (Number(h.shares) || 0) * (Number(h.price) || 0);
    return 0;
  }
  function holdingNativeCost(h){
    if(!h) return 0;
    if(h.kind === "cuenta") return Number(h.amount) || 0;
    if(h.kind === "cdt") return Number(h.principal) || 0;
    if(h.kind === "accion") return (Number(h.shares) || 0) * (Number(h.buyPrice) || Number(h.price) || 0);
    return 0;
  }
  function holdingCurrency(h){
    return (h && h.kind === "accion" && h.quoteCurrency) ? h.quoteCurrency : "";
  }
  // Valor ya convertido a la moneda de tu presupuesto
  function holdingValue(p, h){
    var tasa = fxRate(p, holdingCurrency(h));
    return holdingNativeValue(h) * (tasa == null ? 1 : tasa);
  }
  function holdingCost(p, h){
    var tasa = fxRate(p, holdingCurrency(h));
    return holdingNativeCost(h) * (tasa == null ? 1 : tasa);
  }
  function totalHoldings(p){
    return p.holdings.reduce(function(s,h){ return s + holdingValue(p, h); }, 0);
  }
  function totalHoldingsCost(p){
    return p.holdings.reduce(function(s,h){ return s + holdingCost(p, h); }, 0);
  }
  // Monedas extranjeras en uso a las que todavía les falta tasa
  function missingRates(p){
    var faltan = {};
    p.holdings.forEach(function(h){
      var c = holdingCurrency(h);
      if(c && isForeign(p, c) && fxRate(p, c) == null) faltan[c.toUpperCase()] = true;
    });
    return Object.keys(faltan);
  }
  function usedForeignCurrencies(p){
    var set = {};
    p.holdings.forEach(function(h){
      var c = holdingCurrency(h);
      if(c && isForeign(p, c)) set[c.toUpperCase()] = true;
    });
    return Object.keys(set);
  }
  function getCategory(p, id){
    for(var i=0;i<p.categories.length;i++){ if(p.categories[i].id === id) return p.categories[i]; }
    return null;
  }

  // ---------- state ----------
  var currentTab = "resumen";
  var uiMonth = ymKey(new Date());

  // ---------- generic sheet ----------
  var overlay = document.getElementById("overlay");
  var sheetEl = document.getElementById("sheet");
  function openSheet(html){
    sheetEl.innerHTML = html;
    overlay.classList.add("open");
    var first = sheetEl.querySelector("input,select,textarea");
    if(first) setTimeout(function(){ first.focus(); }, 60);
  }
  function closeSheet(){ overlay.classList.remove("open"); sheetEl.innerHTML = ""; }
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });

  // Avisos propios: el visor de Claude bloquea alert() y confirm() del navegador.
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 3600);
  }

  function showMessageSheet(title, body){
    openSheet(
      '<div class="sheet-head"><h3>' + esc(title) + '</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +

  // ---------- export / import ----------
  // Dentro del visor de Claude el navegador bloquea las descargas que inicia la
  // propia página, así que ahí mostramos el respaldo como texto copiable.
  function inClaudeViewer(){
    try{ return typeof claude !== "undefined" && claude !== null; }
    catch(e){ return false; }
  }

  function showExportFallback(json, filename){
    openSheet(
      '<div class="sheet-head"><h3>Copia tu respaldo</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<p class="sub">Copia este texto y guárdalo en un archivo llamado ' + esc(filename) + '. Sirve igual que el archivo descargado: puedes importarlo después desde cualquier dispositivo.</p>' +
      '<textarea id="exportText" readonly style="width:100%; min-height:220px; font-family:var(--font-mono); font-size:.7rem; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; color:var(--ink);">' + esc(json) + '</textarea>' +
      '<button class="btn block" id="copyExportBtn" style="margin-top:10px;">Copiar al portapapeles</button>'
    );
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    var ta = document.getElementById("exportText");
    document.getElementById("copyExportBtn").addEventListener("click", function(){
      ta.focus(); ta.select();
      var btn = document.getElementById("copyExportBtn");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(function(){ btn.textContent = "¡Copiado!"; })
          .catch(function(){ btn.textContent = "Selecciona y copia manualmente"; });
      }
    });
  }

  function browserDownload(json, filename){
    try{
      var blob = new Blob([json], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      return true;
    }catch(e){ return false; }
  }

  function buildBackupJson(){
    return JSON.stringify({ app: "cuadre", version: 1, exportedAt: new Date().toISOString(), active: DB.active, profiles: DB.profiles }, null, 2);
  }
  function backupFilename(){ return "cuadre-respaldo-" + todayStr() + ".json"; }

  function exportAllData(){
    var json = buildBackupJson();
    var filename = backupFilename();
    if(inClaudeViewer() || !browserDownload(json, filename)){
      showExportFallback(json, filename);
    }
  }

  function showBackupAsText(){
    showExportFallback(buildBackupJson(), backupFilename());
  }

  // Devuelve {ok:true, profiles:{}} o {ok:false, error:"..."}
  function parseBackup(text){
    var data;
    try{ data = JSON.parse(text); }
    catch(e){ return {ok:false, error:"El contenido no es un respaldo válido. Asegúrate de pegar o elegir el archivo .json completo que generó Cuadre al exportar."}; }
    if(!data || typeof data !== "object" || !data.profiles || typeof data.profiles !== "object"){
      return {ok:false, error:"Esto no parece un respaldo de Cuadre. Debe ser el archivo .json que genera el botón Exportar."};
    }
    var clean = {};
    var count = 0;
    Object.keys(data.profiles).forEach(function(id){
      var pr = data.profiles[id];
      if(!pr || typeof pr !== "object" || !pr.name) return;
      clean[id] = {
        id: id,
        name: String(pr.name),
        currency: pr.currency || "$",
        currencyCode: pr.currencyCode || "COP",
        fxRates: (pr.fxRates && typeof pr.fxRates === "object") ? pr.fxRates : {},
        fxUpdatedAt: pr.fxUpdatedAt || "",
        budget: Number(pr.budget) || 0,
        catColorSeq: Number(pr.catColorSeq) || 0,
        categories: Array.isArray(pr.categories) ? pr.categories : [],
        expenses: Array.isArray(pr.expenses) ? pr.expenses : [],
        savings: Array.isArray(pr.savings) ? pr.savings : [],
        interest: Array.isArray(pr.interest) ? pr.interest : [],
        goals: Array.isArray(pr.goals) ? pr.goals : [],
        holdings: Array.isArray(pr.holdings) ? pr.holdings : [],
        debts: Array.isArray(pr.debts) ? pr.debts : [],
        budgetHistory: (pr.budgetHistory && typeof pr.budgetHistory === "object") ? pr.budgetHistory : {},
        cycleStartDay: Number(pr.cycleStartDay) >= 1 ? Number(pr.cycleStartDay) : 1,
        incomes: Array.isArray(pr.incomes) ? pr.incomes : [],
        recurring: Array.isArray(pr.recurring) ? pr.recurring : [],
        recurringDone: (pr.recurringDone && typeof pr.recurringDone === "object") ? pr.recurringDone : {},
        createdAt: pr.createdAt || Date.now()
      };
      count++;
    });
    if(!count) return {ok:false, error:"El respaldo no contiene ningún perfil."};
    return {ok:true, profiles: clean, active: (data.active && clean[data.active]) ? data.active : null};
  }

  function applyImport(profiles, replaceExisting, preferredActive){
    var added = [], replaced = [], kept = [];
    Object.keys(profiles).forEach(function(id){
      var incoming = profiles[id];
      if(DB.profiles[id]){
        if(replaceExisting){ DB.profiles[id] = incoming; replaced.push(incoming.name); }
        else { kept.push(incoming.name); }
      } else {
        DB.profiles[id] = incoming;
        added.push(incoming.name);
      }
    });

    // Dejar activo el perfil que viene del respaldo, para ver de una vez su
    // presupuesto, sus gastos y sus ahorros.
    var target = (preferredActive && DB.profiles[preferredActive]) ? preferredActive : null;
    if(!target){
      var ids = Object.keys(profiles).filter(function(id){ return !!DB.profiles[id]; });
      target = ids.length ? ids[0] : null;
    }
    if(target) DB.active = target;
    if(!DB.active || !DB.profiles[DB.active]) DB.active = Object.keys(DB.profiles)[0];

    var guardado = saveDB();
    closeSheet();
    currentTab = "resumen";
    renderApp();

    var parts = [];
    if(added.length) parts.push(added.length + (added.length===1 ? " perfil agregado" : " perfiles agregados"));
    if(replaced.length) parts.push(replaced.length + (replaced.length===1 ? " actualizado" : " actualizados"));
    if(kept.length) parts.push(kept.length + " sin cambios");
    var resumen = parts.length ? "Listo: " + parts.join(", ") + "." : "No se importó nada.";
    showToast(guardado ? resumen : resumen + " Ojo: este navegador no está guardando los datos.");
  }

  function openImportPreview(profiles, preferredActive){
    var ids = Object.keys(profiles);
    var dupes = ids.filter(function(id){ return !!DB.profiles[id]; });
    var rows = ids.map(function(id){

      return '<div class="exprow">' +
        '<span class="pill ' + (isDupe ? "warn" : "good") + '" style="min-width:60px; text-align:center;">' + (isDupe ? "Ya existe" : "Nuevo") + '</span>' +
        '<div class="meta"><div class="cname">' + esc(pr.name) + '</div><div class="note">' + counts + '</div></div>' +
      '</div>';

    openSheet(
      '<div class="sheet-head"><h3>Revisa antes de importar</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<div class="card">' + rows + '</div>' +
      (dupes.length
        ? '<p class="note-line" style="margin-top:10px;">' + dupes.length + (dupes.length===1 ? ' perfil ya existe' : ' perfiles ya existen') + ' en este dispositivo. Elige qué hacer con ' + (dupes.length===1 ? 'ese' : 'esos') + ':</p>' +
          '<div class="stack" style="margin-top:10px;">' +
            '<button class="btn block" id="impReplace">Reemplazar con los del respaldo</button>' +
            '<button class="btn secondary block" id="impKeep">Conservar los de este dispositivo</button>' +
          '</div>'
        : '<div class="stack" style="margin-top:12px;">' +
            '<button class="btn block" id="impReplace">Importar</button>' +
          '</div>') +
      '<p class="note-line">Importar nunca borra perfiles: solo agrega los nuevos, y reemplaza los repetidos si tú lo eliges.</p>'

    document.getElementById("impReplace").addEventListener("click", function(){ applyImport(profiles, true, preferredActive); });

    if(keep) keep.addEventListener("click", function(){ applyImport(profiles, false, preferredActive); });
  }

  function startImport(text){
    var res = parseBackup(text);
    if(!res.ok){ showMessageSheet("No se pudo importar", res.error); return; }
    openImportPreview(res.profiles, res.active);

      showMessageSheet("No se pudo leer el archivo", "Intenta de nuevo, o usa la opción de pegar el respaldo como texto.");

  // ---------- computations ----------
  function monthExpenses(p, ym){
    return p.expenses.filter(function(e){ return e.date.slice(0,7) === ym; });
  }
  function monthSpentByCategory(p, ym){
    var map = {};
    monthExpenses(p, ym).forEach(function(e){
      map[e.categoryId] = (map[e.categoryId] || 0) + Number(e.amount);
    });
    return map;
  }
  function monthTotalSpent(p, ym){
    return monthExpenses(p, ym).reduce(function(s,e){ return s + Number(e.amount); }, 0);
  }
  // Cuánto tienes repartido entre categorías
  function assignedSum(p){
    return p.categories.reduce(function(s,c){ return s + (Number(c.amount)||0); }, 0);
  }
  // El porcentaje ahora sale del monto, no al revés
  function catPercent(p, c){
    var b = Number(p.budget) || 0;
    if(b <= 0) return 0;
    return ((Number(c.amount)||0) / b) * 100;
  }

  // ---------- ritmo: cuánto por día y por semana ----------
  function daysInMonthOf(ym){
    var partes = ym.split("-");
    return new Date(Number(partes[0]), Number(partes[1]), 0).getDate();
  }
  function isoDate(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  // ---------- ciclo: tu mes puede empezar el día que te pagan ----------
  function cycleStartDay(p){
    var d = Math.round(Number(p.cycleStartDay) || 1);
    return clamp(d, 1, 31);
  }
  // Si el día no existe en ese mes (31 en febrero), se usa el último
  function clampDay(anio, mes, dia){
    var ultimo = new Date(anio, mes + 1, 0).getDate();
    return Math.min(dia, ultimo);
  }
  function diasEntre(a, b){
    return Math.round((b - a) / 86400000);
  }
  // Periodo en curso: desde el último día de corte hasta la víspera del siguiente
  function currentCycle(p){
    var inicio = cycleStartDay(p);
    var hoy = new Date();
    var y = hoy.getFullYear(), m = hoy.getMonth();
    var corteEsteMes = clampDay(y, m, inicio);
    var desde;
    if(hoy.getDate() >= corteEsteMes){
      desde = new Date(y, m, corteEsteMes);
    } else {
      var ant = new Date(y, m - 1, 1);
      desde = new Date(ant.getFullYear(), ant.getMonth(), clampDay(ant.getFullYear(), ant.getMonth(), inicio));
    }
    var sig = new Date(desde.getFullYear(), desde.getMonth() + 1, 1);
    var proximoCorte = new Date(sig.getFullYear(), sig.getMonth(), clampDay(sig.getFullYear(), sig.getMonth(), inicio));
    var hasta = new Date(proximoCorte.getFullYear(), proximoCorte.getMonth(), proximoCorte.getDate() - 1);
    var hoyLimpio = new Date(y, m, hoy.getDate());
    return {
      desde: isoDate(desde),
      hasta: isoDate(hasta),
      dias: diasEntre(desde, hasta) + 1,
      diaActual: diasEntre(desde, hoyLimpio) + 1,
      personalizado: inicio !== 1
    };
  }
  function cycleLabel(c){
    var f = function(iso){
      var q = iso.split("-");
      var d = new Date(Number(q[0]), Number(q[1]) - 1, Number(q[2]));
      return new Intl.DateTimeFormat("es", {day:"numeric", month:"short"}).format(d).replace(".", "");
    };
    return f(c.desde) + " – " + f(c.hasta);
  }
  // ---------- gastos recurrentes (suscripciones, servicios) ----------
  // Cuándo cae este cobro dentro del periodo en curso
  function recurringDateInCycle(r, ciclo){
    var dia = clamp(Math.round(Number(r.day) || 1), 1, 31);
    var candidatos = [];
    [ciclo.desde, ciclo.hasta].forEach(function(iso){
      var q = iso.split("-");
      var y = Number(q[0]), m = Number(q[1]) - 1;
      candidatos.push(isoDate(new Date(y, m, clampDay(y, m, dia))));
    });
    for(var i=0;i<candidatos.length;i++){
      if(candidatos[i] >= ciclo.desde && candidatos[i] <= ciclo.hasta) return candidatos[i];
    }
    return ciclo.desde;
  }
  // Registra los que ya pasaron de fecha, una sola vez por periodo.
  // Si borras el gasto generado, no vuelve a aparecer.
  function applyRecurring(p){
    if(!p.recurring.length) return false;
    var ciclo = currentCycle(p);
    var hoy = todayStr();
    var creados = 0;
    p.recurring.forEach(function(r){
      var fecha = recurringDateInCycle(r, ciclo);
      if(fecha > hoy) return;                       // todavía no le toca
      var clave = r.id + "|" + ciclo.desde;
      if(p.recurringDone[clave]) return;            // ya se registró este periodo
      p.expenses.push({
        id: uid(), date: fecha,
        categoryId: r.categoryId,
        amount: Number(r.amount) || 0,
        note: r.name,
        recurringId: r.id
      });
      p.recurringDone[clave] = true;
      creados++;
    });
    return creados > 0;
  }

  // ---------- todo lo que entra y sale en un rango ----------
  function incomesInRange(p, desde, hasta){
    return p.incomes.reduce(function(s,x){
      var d = String(x.date);
      return s + ((d >= desde && d <= hasta) ? (Number(x.amount)||0) : 0);
    }, 0);
  }
  // Pagos de deudas: "debo" es plata que sale, "prestado" es plata que vuelve
  function debtPaymentsInRange(p, desde, hasta, kind){
    return p.debts.reduce(function(s,d){
      if(d.kind !== kind) return s;
      return s + (d.payments || []).reduce(function(a,x){
        var f = String(x.date);
        return a + ((f >= desde && f <= hasta) ? (Number(x.amount)||0) : 0);
      }, 0);
    }, 0);
  }

  // El balance del periodo en curso, con todo incluido
  function periodTotals(p){
    var c = currentCycle(p);
    var base = Number(p.budget) || 0;
    var gastos = spentInRange(p, c.desde, c.hasta);
    var ingresos = incomesInRange(p, c.desde, c.hasta);
    var cobros = debtPaymentsInRange(p, c.desde, c.hasta, "prestado");
    var pagos = debtPaymentsInRange(p, c.desde, c.hasta, "debo");
    var total = base + ingresos + cobros;   // todo lo que tienes para el periodo
    var salidas = gastos + pagos;           // todo lo que se fue
    return {
      ciclo: c, base: base,
      gastos: gastos, ingresos: ingresos, cobros: cobros, pagos: pagos,
      total: total, salidas: salidas, disponible: total - salidas,
      hayExtras: (ingresos > 0 || cobros > 0 || pagos > 0)
    };
  }

  function spentByCategoryInRange(p, desde, hasta){
    var map = {};
    p.expenses.forEach(function(e){
      var d = String(e.date);
      if(d >= desde && d <= hasta) map[e.categoryId] = (map[e.categoryId] || 0) + (Number(e.amount)||0);
    });
    return map;
  }
  // Lunes a domingo de la semana en curso
  function weekRange(){
    var hoy = new Date();
    var dow = (hoy.getDay() + 6) % 7; // 0 = lunes
    var lunes = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - dow);
    var domingo = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + 6);
    return { desde: isoDate(lunes), hasta: isoDate(domingo), diaSemana: dow + 1 };
  }
  function spentInRange(p, desde, hasta){
    return p.expenses.reduce(function(s,e){
      var d = String(e.date);
      return s + ((d >= desde && d <= hasta) ? (Number(e.amount)||0) : 0);
    }, 0);
  }

  function paceInfo(p){
    var T = periodTotals(p);
    var ciclo = T.ciclo;
    var hoyStr = todayStr();
    var dias = ciclo.dias;
    var diaActual = ciclo.diaActual;
    var restantes = Math.max(1, dias - diaActual + 1); // hoy cuenta
    var presupuesto = T.total; // presupuesto ya ajustado con ingresos y deudas

    var gastadoMes = T.salidas;
    var gastadoHoy = spentInRange(p, hoyStr, hoyStr) + debtPaymentsInRange(p, hoyStr, hoyStr, "debo");
    var gastadoAntesDeHoy = gastadoMes - gastadoHoy;

    // Plan puro: repartir el presupuesto en partes iguales
    var planDiario = presupuesto / dias;
    var planSemanal = planDiario * 7;

    // Ritmo real: lo que queda, repartido en los días que faltan
    var cupoHoy = Math.max(0, (presupuesto - gastadoAntesDeHoy)) / restantes;
    var quedaHoy = cupoHoy - gastadoHoy;

    var semana = weekRange();
    var gastadoSemana = spentInRange(p, semana.desde, semana.hasta);
    var cupoSemana = cupoHoy * 7;

    // ¿Vas ahorrando? Comparar con lo que "tocaba" llevar gastado a esta altura
    var esperado = planDiario * diaActual;
    var diferencia = esperado - gastadoMes; // positivo = vas por debajo

    return {
      ciclo: ciclo, dias: dias, diaActual: diaActual, restantes: restantes,
      presupuesto: presupuesto,
      planDiario: planDiario, planSemanal: planSemanal,
      gastadoMes: gastadoMes, gastadoHoy: gastadoHoy,
      cupoHoy: cupoHoy, quedaHoy: quedaHoy,
      gastadoSemana: gastadoSemana, cupoSemana: cupoSemana,
      diaSemana: semana.diaSemana,
      esperado: esperado, diferencia: diferencia
    };
  }

  function paceCard(p){
    var r = paceInfo(p);
    if(r.presupuesto <= 0) return "";

    var vaBien = r.diferencia >= 0;
    var pctSemana = r.cupoSemana > 0 ? clamp((r.gastadoSemana / r.cupoSemana) * 100, 0, 100) : 0;
    var estadoSemana = r.gastadoSemana > r.cupoSemana ? "danger" : (pctSemana >= 85 ? "warn" : "good");

    return '<div class="card">' +
      (r.ciclo.personalizado ? '<div class="ciclo-tag">Periodo ' + cycleLabel(r.ciclo) + '</div>' : '') +
      '<div class="row" style="align-items:flex-start;">' +
        '<div>' +
          '<div class="eyebrow">Puedes gastar hoy</div>' +
          '<div class="pace-big tnum ' + (r.quedaHoy < 0 ? "neg" : "") + '">' + fmtSmart(p, r.quedaHoy) + '</div>' +
          '<div class="note-line" style="margin-top:2px;">de ' + fmt(p, r.cupoHoy) + ' · llevas ' + fmt(p, r.gastadoHoy) + '</div>' +
        '</div>' +
        '<span class="pill ' + (vaBien ? "good" : "danger") + '">' + (vaBien ? "Ahorrando" : "Por encima") + '</span>' +
      '</div>' +

      '<div class="pace-sep"></div>' +

      '<div class="row" style="margin-bottom:6px;">' +
        '<span class="pace-k">Esta semana</span>' +
        '<span class="pace-v tnum">' + fmt(p, r.gastadoSemana) + ' de ' + fmt(p, r.cupoSemana) + '</span>' +
      '</div>' +
      '<div class="progress"><span style="width:' + pctSemana + '%; background:' +
        (estadoSemana === "danger" ? "var(--danger)" : estadoSemana === "warn" ? "var(--warn)" : "var(--accent)") + '"></span></div>' +

      '<div class="pace-sep"></div>' +

      '<div class="row">' +
        '<span class="pace-k">' + (vaBien ? "Llevas ahorrado este periodo" : "Vas por encima del plan") + '</span>' +
        '<span class="pace-v tnum ' + (vaBien ? "pos" : "neg") + '">' + (vaBien ? "+" : "") + fmt(p, r.diferencia) + '</span>' +
      '</div>' +
      '<p class="note-line">Día ' + r.diaActual + ' de ' + r.dias + ': tocaría llevar ' + fmt(p, r.esperado) + ' y llevas ' + fmt(p, r.gastadoMes) + '. Quedan ' + r.restantes + (r.restantes === 1 ? ' día' : ' días') + '.</p>' +
    '</div>';
  }

  // Cuánto sobró (o faltó) en cada mes cerrado
  function savingsByMonth(p){
    if((Number(p.budget) || 0) <= 0) return "";
    var actual = ymKey(new Date());
    var meses = lastMonths(6).filter(function(ym){ return ym !== actual; }).reverse();
    var conDatos = meses.filter(function(ym){ return monthTotalSpent(p, ym) > 0; });
    if(!conDatos.length){
      return '<div class="empty">Cuando cierre el mes verás aquí cuánto te sobró.</div>';
    }
    return conDatos.map(function(ym){
      var gastado = monthTotalSpent(p, ym);
      var pres = budgetFor(p, ym);
      var sobra = pres.valor - gastado;
      return '<div class="mesrow">' +
        '<div style="min-width:0;">' +
          '<div class="mes-nombre">' + monthLabel(ym) + '</div>' +
          '<div class="mes-sub tnum">' + fmt(p, gastado) + ' de ' + fmt(p, pres.valor) +
            (pres.guardado ? '' : ' <span class="mes-est">(estimado)</span>') + '</div>' +
        '</div>' +
        '<span class="pill ' + (sobra >= 0 ? "good" : "danger") + '">' + (sobra >= 0 ? "+" : "") + fmt(p, sobra) + '</span>' +
      '</div>';
    }).join("");
  }
  // ¿Algún mes del historial se está comparando sin registro propio?
  function hayMesesEstimados(p){
    var actual = ymKey(new Date());
    return lastMonths(6).filter(function(ym){ return ym !== actual; })
      .some(function(ym){ return monthTotalSpent(p, ym) > 0 && !budgetFor(p, ym).guardado; });
  }

  // ---------- gráfica mensual: gastos vs ahorro ----------
  function monthSaved(p, ym){
    var s = p.savings.reduce(function(a,x){ return a + (String(x.date).slice(0,7) === ym ? Number(x.amount)||0 : 0); }, 0);
    var i = p.interest.reduce(function(a,x){ return a + (String(x.date).slice(0,7) === ym ? Number(x.amount)||0 : 0); }, 0);
    return s + i;
  }
  function lastMonths(n){
    var hoy = ymKey(new Date());
    var out = [];
    for(var k = n - 1; k >= 0; k--) out.push(ymAdd(hoy, -k));
    return out;
  }
  function shortMonth(ym){
    var partes = ym.split("-");
    var d = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
    return new Intl.DateTimeFormat("es", {month:"short"}).format(d).replace(".", "");
  }
  // Barra con las esquinas de arriba redondeadas, apoyada en el eje
  function barPath(x, y, w, h, r){
    if(h <= 0) return "";
    var rr = Math.min(r, w/2, h);
    return "M" + x + "," + (y+h) +
           " L" + x + "," + (y+rr) +
           " Q" + x + "," + y + " " + (x+rr) + "," + y +
           " L" + (x+w-rr) + "," + y +
           " Q" + (x+w) + "," + y + " " + (x+w) + "," + (y+rr) +
           " L" + (x+w) + "," + (y+h) + " Z";
  }

  function buildMonthlyChart(p){
    var meses = lastMonths(6);
    var datos = meses.map(function(ym){
      return { ym: ym, gasto: monthTotalSpent(p, ym), ahorro: monthSaved(p, ym) };
    });
    var max = datos.reduce(function(m,d){ return Math.max(m, d.gasto, d.ahorro); }, 0);
    if(max <= 0){
      return '<div class="empty">Cuando registres gastos o ahorros, aquí verás cómo va cada mes.</div>';
    }

    var W = 320, H = 168, padL = 6, padR = 6, padTop = 14, base = H - 26;
    var alto = base - padTop;
    var anchoGrupo = (W - padL - padR) / meses.length;
    var anchoBarra = Math.min(16, (anchoGrupo - 10) / 2);
    var sep = 2; // separación entre las dos barras del mismo mes

    var barras = datos.map(function(d, i){
      var centro = padL + anchoGrupo * i + anchoGrupo / 2;
      var x1 = centro - anchoBarra - sep / 2;
      var x2 = centro + sep / 2;
      var h1 = max > 0 ? (d.gasto / max) * alto : 0;
      var h2 = max > 0 ? (d.ahorro / max) * alto : 0;
      var partes = "";
      if(h1 > 0) partes += '<path d="' + barPath(x1, base - h1, anchoBarra, h1, 4) + '" fill="var(--serie-gasto)"><title>' + shortMonth(d.ym) + ' · gastos ' + fmt(p, d.gasto) + '</title></path>';
      if(h2 > 0) partes += '<path d="' + barPath(x2, base - h2, anchoBarra, h2, 4) + '" fill="var(--serie-ahorro)"><title>' + shortMonth(d.ym) + ' · ahorro ' + fmt(p, d.ahorro) + '</title></path>';
      partes += '<text x="' + centro + '" y="' + (H - 8) + '" text-anchor="middle" class="chart-mes">' + shortMonth(d.ym) + '</text>';
      return partes;
    }).join("");

    var ultimo = datos[datos.length - 1];
    return '<div class="chartwrap">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gastos y ahorro de los últimos 6 meses">' +
        '<line x1="' + padL + '" y1="' + padTop + '" x2="' + (W-padR) + '" y2="' + padTop + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>' +
        '<text x="' + padL + '" y="' + (padTop - 4) + '" class="chart-eje">' + fmt(p, max) + '</text>' +
        '<line x1="' + padL + '" y1="' + base + '" x2="' + (W-padR) + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>' +
        barras +
      '</svg>' +
      '<div class="chart-leyenda">' +
        '<span class="leg-item"><span class="leg-chip" style="background:var(--serie-gasto)"></span>Gastos <b class="tnum">' + fmt(p, ultimo.gasto) + '</b></span>' +
        '<span class="leg-item"><span class="leg-chip" style="background:var(--serie-ahorro)"></span>Ahorro <b class="tnum">' + fmt(p, ultimo.ahorro) + '</b></span>' +
      '</div>' +
      '<p class="note-line">Últimos 6 meses. Las cifras en negrita son las de ' + monthLabel(ultimo.ym).toLowerCase() + '.</p>' +
    '</div>';
  }

  // ---------- Resumen ----------
  function storageWarning(){
    if(storageOk) return "";
    return '<div class="warncard">' +
      '<div class="warncard-title">Este navegador no está guardando tus datos</div>' +
      '<p>Puedes usar Cuadre normalmente, pero al cerrar o recargar la página se perderá lo que registres. ' +
      'Antes de salir, usa <b>Exportar</b> aquí abajo y guarda tu respaldo; al volver, impórtalo para seguir donde ibas.</p>' +
    '</div>';
  }

  function backupSection(){
    return '<div>' +
      '<div class="section-title">Respaldo de datos</div>' +
      '<div class="card">' +
        '<div class="fab-row" style="margin-top:0;">' +
          '<button class="btn secondary block" data-action="export">Exportar</button>' +
          '<button class="btn secondary block" data-action="import">Importar</button>' +
        '</div>' +
        '<input type="file" id="importFile" style="display:none;">' +
        '<p class="note-line">Exportar guarda un archivo con todos tus perfiles y sus registros: consérvalo como respaldo o pásalo a otro celular. Al importar, esos perfiles se suman a los que ya tienes aquí; si alguno coincide, te preguntamos antes de reemplazarlo.</p>' +
        '<div style="display:flex; flex-direction:column; align-items:flex-start;">' +
          '<button class="linkbtn" data-action="export-text">Ver el respaldo como texto para copiarlo</button>' +
          '<button class="linkbtn" data-action="import-text">Pegar un respaldo en texto</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function viewResumen(p){
    var thisMonth = ymKey(new Date());
    // El periodo en curso: el mes calendario, o tu ciclo si lo configuraste
    var T = periodTotals(p);
    var ciclo = T.ciclo;
    var spent = T.gastos;
    var remaining = T.disponible;
    var spentByCat = spentByCategoryInRange(p, ciclo.desde, ciclo.hasta);
    var overallPct = T.total > 0 ? clamp((T.salidas / T.total) * 100, 0, 999) : 0;
    var overallState = overallPct >= 100 ? "danger" : overallPct >= 85 ? "warn" : "good";

    if(!p.budget){
      return '<div class="stack">' +
        storageWarning() +
        '<div class="card" style="text-align:center; padding:28px 18px;">' +
          '<div class="eyebrow">Primer paso</div>' +
          '<h2 style="margin:10px 0 6px;">Configura tu presupuesto</h2>' +
          '<p class="sub">Define cuánto ingresas al mes y cómo se reparte entre tus categorías de gasto.</p>' +
          '<button class="btn block" style="margin-top:14px;" data-goto="presupuesto">Ir a Presupuesto</button>' +
        '</div>' +
        backupSection() +
      '</div>';
    }

    var catCards = p.categories.map(function(c, idx){
      var sp = spentByCat[c.id] || 0;
      var alloc = Number(c.amount) || 0;
      var pct = alloc > 0 ? clamp((sp/alloc)*100, 0, 100) : (sp>0?100:0);
      var state = alloc > 0 && sp > alloc ? "danger" : pct >= 85 ? "warn" : "good";
      return '<div class="catcard">' +
        '<div class="row"><div class="row" style="gap:8px;"><span class="catdot" style="background:' + catColor(c.colorIdx!=null?c.colorIdx:idx) + '"></span><span style="font-weight:600;">' + esc(c.name) + '</span></div>' +
        '<span class="pill ' + state + '">' + Math.round(pct) + '%</span></div>' +
        '<div class="progress"><span style="width:' + pct + '%; background:' + (state==="danger"?"var(--danger)":state==="warn"?"var(--warn)":"var(--accent)") + '"></span></div>' +
        '<div class="amounts row" style="margin-top:6px;"><span>' + fmt(p,sp) + ' gastado</span><span>' + fmt(p,alloc) + ' asignado</span></div>' +
      '</div>';
    }).join("");

    var orphanSpent = spent - Object.keys(spentByCat).reduce(function(s,catId){
      return getCategory(p, catId) ? s + spentByCat[catId] : s;
    }, 0);

    return '<div class="stack">' +
      storageWarning() +
      '<div class="card">' +
        '<div class="eyebrow">' + (ciclo.personalizado ? cycleLabel(ciclo) : monthLabel(thisMonth)) + '</div>' +
        '<div class="headline tnum">' + fmt(p, remaining) + '</div>' +
        '<div class="sub">disponible de ' + fmt(p, T.total) + (T.hayExtras ? ' <span class="ajustado">ajustado</span>' : '') + '</div>' +
        '<div class="progress" style="margin-top:12px; height:10px;"><span style="width:' + Math.min(overallPct,100) + '%; background:' + (overallState==="danger"?"var(--danger)":overallState==="warn"?"var(--warn)":"var(--accent)") + '"></span></div>' +
        '<div class="row" style="margin-top:8px; font-size:.78rem; color:var(--ink-soft);"><span>Gastado: ' + fmt(p,spent) + '</span><span>' + Math.round(overallPct) + '% ' + (ciclo.personalizado ? "del periodo" : "del mes") + '</span></div>' +
        (T.hayExtras ?
          '<div class="desglose">' +
            '<div class="desg-row"><span>Presupuesto</span><span class="tnum">' + fmt(p, T.base) + '</span></div>' +
            (T.ingresos > 0 ? '<div class="desg-row pos"><span>+ Ingresos extra</span><span class="tnum">' + fmt(p, T.ingresos) + '</span></div>' : '') +
            (T.cobros > 0 ? '<div class="desg-row pos"><span>+ Te pagaron deudas</span><span class="tnum">' + fmt(p, T.cobros) + '</span></div>' : '') +
            (T.pagos > 0 ? '<div class="desg-row neg"><span>− Pagaste deudas</span><span class="tnum">' + fmt(p, T.pagos) + '</span></div>' : '') +
          '</div>'
        : '') +
      '</div>' +
      (paceCard(p) ? '<div><div class="section-title">Tu ritmo</div>' + paceCard(p) + '</div>' : '') +
      '<div>' +
        '<div class="section-title">Gastos y ahorro por mes</div>' +
        '<div class="card">' + buildMonthlyChart(p) + '</div>' +
      '</div>' +
      (Number(p.budget) > 0 ? '<div>' +
        '<div class="section-title">¿Ahorraste en meses pasados?</div>' +
        '<div class="card">' + savingsByMonth(p) + '</div>' +
        '<p class="note-line">Cada mes se compara con el presupuesto que tenías entonces.' +
          (hayMesesEstimados(p) ? ' Los marcados como estimado son de antes de que la app llevara ese registro, así que usan el presupuesto actual.' : '') +
        '</p>' +
      '</div>' : '') +
      '<div>' +
        '<div class="section-title">Por categoría</div>' +
        '<div class="card">' + catCards + '</div>' +
        (orphanSpent > 0 ? '<p class="note-line">Gastos sin categoría (eliminada): ' + fmt(p, orphanSpent) + '</p>' : '') +
      '</div>' +
      '<div class="fab-row">' +
        '<button class="btn block" data-action="add-expense">+ Registrar gasto</button>' +
      '</div>' +
      backupSection() +
    '</div>';
  }

  // ---------- Presupuesto ----------
  function budgetBarHtml(p){
    var b = Number(p.budget) || 0;
    var asignado = assignedSum(p);
    var escala = Math.max(b, asignado) || 1;
    return p.categories.map(function(c, idx){
      var w = ((Number(c.amount)||0) / escala) * 100;
      return '<span style="width:' + w + '%; background:' + catColor(c.colorIdx!=null?c.colorIdx:idx) + '"></span>';
    }).join("");
  }

  function budgetStatus(p){
    var b = Number(p.budget) || 0;
    var asignado = assignedSum(p);
    var resto = b - asignado;
    if(b <= 0) return {clase:"warn", izq: fmt(p, asignado) + " repartidos", der:"Pon primero tu presupuesto"};
    if(Math.abs(resto) < 1) return {clase:"ok", izq:"100% repartido", der:"Todo el presupuesto asignado"};
    if(resto > 0) return {clase:"warn", izq: Math.round((asignado/b)*100) + "% repartido", der:"Te quedan " + fmt(p, resto)};
    return {clase:"warn", izq: Math.round((asignado/b)*100) + "% repartido", der:"Te pasaste " + fmt(p, -resto)};
  }

  function viewPresupuesto(p){
    var estado = budgetStatus(p);

    var rows = p.categories.map(function(c, idx){
      return '<div class="catrow">' +
        '<span class="catdot" style="background:' + catColor(c.colorIdx!=null?c.colorIdx:idx) + '"></span>' +
        '<input class="cat-name" data-id="' + c.id + '" value="' + esc(c.name) + '" maxlength="20" aria-label="Nombre de categoría">' +
        '<input class="cat-amount" type="text" inputmode="decimal" data-id="' + c.id + '" value="' + (Number(c.amount)||0) + '" aria-label="Monto asignado">' +
        '<span class="catamt tnum" id="amt-' + c.id + '">' + fmtPct(catPercent(p, c), 1) + '%</span>' +
        '<button class="icon-btn" data-delcat="' + c.id + '" title="Eliminar categoría">✕</button>' +
      '</div>';
    }).join("");

    return '<div class="stack">' +
      '<div class="card">' +
        '<div class="eyebrow">Presupuesto mensual</div>' +
        '<div class="row" style="align-items:baseline; gap:8px; margin-top:6px;">' +

  // ---------- Deudas ----------
  function debtPaid(d){
    return (d.payments || []).reduce(function(s,x){ return s + (Number(x.amount)||0); }, 0);
  }
  function debtLeft(d){
    return Math.max(0, (Number(d.amount)||0) - debtPaid(d));
  }
  function debtsTotal(p, kind){
    return p.debts.filter(function(d){ return d.kind === kind; })
                  .reduce(function(s,d){ return s + debtLeft(d); }, 0);
  }

  function viewDeudas(p){
    var debo = debtsTotal(p, "debo");
    var meDeben = debtsTotal(p, "prestado");
    var neto = meDeben - debo;

    function lista(kind){
      var items = p.debts.filter(function(d){ return d.kind === kind; })
        .sort(function(a,b){ return debtLeft(b) - debtLeft(a); });
      if(!items.length){
        return '<div class="empty">' + (kind === "debo" ? "No tienes deudas registradas." : "Nadie te debe por ahora.") + '</div>';
      }
      return items.map(function(d){
        var total = Number(d.amount) || 0;
        var pagado = debtPaid(d);
        var falta = debtLeft(d);
        var pct = total > 0 ? clamp((pagado / total) * 100, 0, 100) : 0;
        var saldada = falta <= 0;
        return '<div class="debt' + (saldada ? " saldada" : "") + '">' +
          '<div class="row">' +
            '<div style="min-width:0;">' +
              '<div class="debt-person">' + esc(d.person) + '</div>' +
              (d.concept ? '<div class="debt-concept">' + esc(d.concept) + '</div>' : '') +
            '</div>' +
            '<div class="row" style="gap:4px;">' +
              '<div style="text-align:right;">' +
                '<div class="debt-left tnum">' + (saldada ? "Saldada" : fmt(p, falta)) + '</div>' +
                (pagado > 0 && !saldada ? '<div class="debt-paid tnum">pagado ' + fmt(p, pagado) + '</div>' : '') +
              '</div>' +
              '<button class="icon-btn" data-deldebt="' + d.id + '" title="Eliminar">✕</button>' +
            '</div>' +
          '</div>' +
          '<div class="progress" style="margin-top:8px;"><span style="width:' + pct + '%; background:' + (saldada ? "var(--good)" : "var(--accent)") + '"></span></div>' +
          '<div class="amounts row" style="margin-top:6px;">' +
            '<span>' + fmt(p, pagado) + ' de ' + fmt(p, total) + '</span>' +
            '<span>' + (d.date ? dateShort(d.date) : "") + '</span>' +
          '</div>' +
          (saldada ? '' : '<button class="linkbtn" data-paydebt="' + d.id + '">Registrar ' + (kind === "debo" ? "pago" : "abono recibido") + '</button>') +
        '</div>';
      }).join("");
    }

    return '<div class="stack">' +
      '<div class="card">' +
        '<div class="eyebrow">Balance de deudas</div>' +
        '<div class="headline tnum ' + (neto >= 0 ? "pos" : "neg") + '">' + (neto >= 0 ? "+" : "") + fmt(p, neto) + '</div>' +
        '<div class="sub">' + (neto >= 0 ? "a tu favor" : "en contra") + '</div>' +
        '<div class="row" style="margin-top:12px; font-size:.82rem;">' +
          '<span>Debo: <b class="tnum neg">' + fmt(p, debo) + '</b></span>' +
          '<span>Me deben: <b class="tnum pos">' + fmt(p, meDeben) + '</b></span>' +
        '</div>' +
      '</div>' +

      '<div class="fab-row" style="margin-top:0;">' +
        '<button class="btn block" data-action="add-debt-debo">+ Yo debo</button>' +
        '<button class="btn secondary block" data-action="add-debt-prestado">+ Me deben</button>' +
      '</div>' +

      '<div>' +
        '<div class="section-title">Lo que debo</div>' +
        '<div class="card">' + lista("debo") + '</div>' +
      '</div>' +

      '<div>' +
        '<div class="section-title">Lo que me deben</div>' +
        '<div class="card">' + lista("prestado") + '</div>' +
      '</div>' +

      '<p class="note-line">Estos movimientos son aparte de tu presupuesto. Si un pago también fue un gasto del mes, regístralo además en Gastos.</p>' +
    '</div>';
  }
