  // ---------- Ahorros ----------
  function buildGrowthChart(points){
    if(points.length < 2){
      return '<div class="empty">Agrega registros de ahorro o interés para ver tu progreso.</div>';
    }
    var w = 300, h = 110, pad = 8;
    var max = points[points.length-1].cum;
    var min = Math.min(0, points[0].cum);
    var range = (max - min) || 1;
    var stepX = (w - pad*2) / (points.length - 1);
    var coords = points.map(function(pt, i){
      var x = pad + i * stepX;
      var y = h - pad - ((pt.cum - min) / range) * (h - pad*2);
      return [x,y];
    });
    var path = coords.map(function(c,i){ return (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1); }).join(" ");
    var areaPath = path + " L" + coords[coords.length-1][0].toFixed(1) + "," + (h-pad) + " L" + coords[0][0].toFixed(1) + "," + (h-pad) + " Z";
    var last = coords[coords.length-1];
    var gridLines = [0.25,0.5,0.75].map(function(f){
      var y = pad + f * (h - pad*2);
      return '<line x1="' + pad + '" y1="' + y + '" x2="' + (w-pad) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1" />';
    }).join("");
    return '<div class="chartwrap"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="growthFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      gridLines +
      '<path d="' + areaPath + '" fill="url(#growthFill)" stroke="none"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="var(--accent)"/>' +
    '</svg></div>';
  }

  // Dona SVG: un arco por cada tipo de ahorro
  function buildDonut(slices, total, p){
    var size = 200, cx = 100, cy = 100, r = 72, grosor = 26;
    if(!slices.length || total <= 0){
      return '<div class="empty">Agrega un tipo de ahorro para ver la distribución.</div>';
    }
    var circ = 2 * Math.PI * r;
    var offset = 0;
    var arcos = slices.map(function(s){
      var frac = s.value / total;
      var len = frac * circ;
      // 0.6 de separación visual entre porciones, sin dejar huecos si solo hay una
      var gap = slices.length > 1 ? 1.5 : 0;
      var dash = Math.max(0, len - gap) + ' ' + (circ - Math.max(0, len - gap));
      var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" ' +
        'stroke="' + s.color + '" stroke-width="' + grosor + '" ' +
        'stroke-dasharray="' + dash + '" stroke-dashoffset="' + (-offset) + '" ' +
        'transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(s.label) + ': ' + Math.round(frac*100) + '%</title></circle>';
      offset += len;
      return el;
    }).join("");

    var leyenda = slices.map(function(s){
      var pct = total > 0 ? (s.value / total) * 100 : 0;
      return '<div class="leg-row">' +
        '<span class="catdot" style="background:' + s.color + '"></span>' +
        '<span class="leg-name">' + esc(s.label) + '</span>' +
        '<span class="leg-pct tnum">' + (pct < 1 && pct > 0 ? "<1" : Math.round(pct)) + '%</span>' +
        '<span class="leg-val tnum">' + fmt(p, s.value) + '</span>' +
      '</div>';
    }).join("");

    return '<div class="donut-wrap">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Distribución de tus ahorros">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + grosor + '"/>' +
        arcos +
        '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="donut-total">' + fmt(p, total) + '</text>' +
        '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" class="donut-sub">en ' + slices.length + (slices.length===1 ? ' lugar' : ' lugares') + '</text>' +
      '</svg>' +
      '<div class="leyenda">' + leyenda + '</div>' +
    '</div>';
  }

  function viewAhorros(p){
    var totalSavings = p.savings.reduce(function(s,x){ return s+Number(x.amount); }, 0);
    var totalInterest = p.interest.reduce(function(s,x){ return s+Number(x.amount); }, 0);
    var patrimonio = totalSavings + totalInterest;

    var combined = p.savings.map(function(x){ return {date:x.date, amount:Number(x.amount), type:"ahorro", note:x.note, id:x.id}; })
      .concat(p.interest.map(function(x){ return {date:x.date, amount:Number(x.amount), type:"interes", note:x.note, id:x.id}; }));
    var sortedAsc = combined.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var cum = 0;
    var points = sortedAsc.map(function(e){ cum += e.amount; return {cum: cum}; });
    if(points.length) points.unshift({cum:0});

    var listDesc = combined.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    var rows = listDesc.map(function(e){
      return '<div class="exprow">' +
        '<span class="pill ' + (e.type==="ahorro"?"good":"warn") + '" style="min-width:56px; text-align:center;">' + (e.type==="ahorro"?"Ahorro":"Interés") + '</span>' +
        '<div class="meta"><div class="cname">' + dateShort(e.date) + '</div>' + (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '') + '</div>' +
        '<div class="amt tnum">' + fmt(p, e.amount) + '</div>' +
        '<button class="icon-btn" data-del' + (e.type==="ahorro"?"sav":"int") + '="' + e.id + '" title="Eliminar">✕</button>' +
      '</div>';
    }).join("");

    // ----- valor actual según los tipos de ahorro -----
    var holdTotal = totalHoldings(p);
    var holdCost = totalHoldingsCost(p);
    var rendimiento = holdTotal - holdCost;
    var hayTipos = p.holdings.length > 0;
    var totalReferencia = hayTipos ? holdTotal : patrimonio;

    var slices = p.holdings.map(function(h, i){
      return { label: h.name || KIND_LABEL[h.kind] || "Sin nombre",
               value: holdingValue(p, h),
               color: catColor(h.colorIdx != null ? h.colorIdx : i) };
    }).filter(function(s){ return s.value > 0; });

    // ----- metas -----
    var metasHtml = p.goals.map(function(g){
      var target = Number(g.target) || 0;
      var pct = target > 0 ? clamp((totalReferencia / target) * 100, 0, 100) : 0;
      var falta = Math.max(0, target - totalReferencia);
      var cumplida = target > 0 && totalReferencia >= target;
      return '<div class="goal">' +
        '<div class="row">' +
          '<span class="goal-name">' + esc(g.name) + '</span>' +
          '<div class="row" style="gap:6px;">' +
            '<span class="pill ' + (cumplida ? "good" : "warn") + '">' + Math.round(pct) + '%</span>' +
            '<button class="icon-btn" data-delgoal="' + g.id + '" title="Eliminar meta">✕</button>' +
          '</div>' +
        '</div>' +
        '<div class="progress"><span style="width:' + pct + '%; background:' + (cumplida ? "var(--good)" : "var(--accent)") + '"></span></div>' +
        '<div class="amounts row" style="margin-top:6px;">' +
          '<span>' + fmt(p, Math.min(totalReferencia, target)) + ' de ' + fmt(p, target) + '</span>' +
          '<span>' + (cumplida ? "¡Meta cumplida!" : "Faltan " + fmt(p, falta)) + '</span>' +
        '</div>' +
      '</div>';
    }).join("");

    // ----- lista de tipos de ahorro -----
    var tiposHtml = p.holdings.map(function(h, i){
      var color = catColor(h.colorIdx != null ? h.colorIdx : i);
      var moneda = holdingCurrency(h);
      var extranjera = moneda && isForeign(p, moneda);
      var tasa = fxRate(p, moneda);
      var nativo = holdingNativeValue(h);
      var valor = holdingValue(p, h);
      var detalle = "";

      if(h.kind === "cdt"){
        var abierto = cdtIsOpen(h);
        var manual = cdtManual(h);
        var elapsed = cdtElapsedDays(h);
        var interesHoy = valor - (Number(h.principal) || 0);
        var filaDerecha = manual
          ? '<div><span class="hold-k">Valor</span><span class="hold-v">Puesto por ti</span></div>'
          : (abierto
              ? '<div><span class="hold-k">Lleva</span><span class="hold-v">' + elapsed + ' días</span></div>'
              : '<div><span class="hold-k">' + (Math.max(0, cdtTermDays(h) - elapsed) > 0 ? "Faltan" : "Estado") + '</span><span class="hold-v">' + (Math.max(0, cdtTermDays(h) - elapsed) > 0 ? Math.max(0, cdtTermDays(h) - elapsed) + " días" : "Vencido") + '</span></div>');

        detalle =
          '<div class="hold-grid">' +
            '<div><span class="hold-k">Capital</span><span class="hold-v tnum">' + fmt(p, h.principal) + '</span></div>' +
            '<div><span class="hold-k">Tasa</span><span class="hold-v tnum">' + (Number(h.rate) > 0 ? fmtPct(Number(h.rate), 2) + '% E.A.' : '—') + '</span></div>' +
            '<div><span class="hold-k">' + (interesHoy >= 0 ? "Ganancia a hoy" : "Diferencia") + '</span><span class="hold-v tnum ' + (interesHoy >= 0 ? "pos" : "neg") + '">' + (interesHoy >= 0 ? "+" : "") + fmt(p, interesHoy) + '</span></div>' +
            filaDerecha +
          '</div>' +
          '<div class="hold-foot">' +
            (manual
              ? 'Valor ajustado por ti. Bórralo al editar para volver al cálculo automático.'
              : (abierto
                  ? 'Sin plazo fijo: sigue creciendo mientras esté abierto. Puedes ajustar el valor a mano cuando quieras.'
                  : 'Al vencer (' + (Number(h.termMonths)||0) + ' meses): <b class="tnum">' + fmt(p, cdtValueAt(h, cdtTermDays(h))) + '</b> · ganas <b class="tnum">' + fmt(p, cdtValueAt(h, cdtTermDays(h)) - (Number(h.principal)||0)) + '</b>')) +
          '</div>';
      } else if(h.kind === "accion"){
        var shares = Number(h.shares) || 0;
        var price = Number(h.price) || 0;
        var buy = Number(h.buyPrice) || 0;
        var costoNativo = shares * buy;
        var difNativo = nativo - costoNativo;
        var difPct = costoNativo > 0 ? (difNativo / costoNativo) * 100 : 0;
        var precioTxt = extranjera ? fmtNative(moneda, price) : fmtDec(p, price, 2);
        var compraTxt = buy ? (extranjera ? fmtNative(moneda, buy) : fmtDec(p, buy, 2)) : "—";
        var difTxt = extranjera
          ? (difNativo >= 0 ? "+" : "") + fmtNative(moneda, difNativo)
          : (difNativo >= 0 ? "+" : "") + fmtSmart(p, difNativo);

        detalle =
          '<div class="hold-grid">' +
            '<div><span class="hold-k">Cantidad</span><span class="hold-v tnum">' + shares.toLocaleString("es-CO", {maximumFractionDigits:4}) + '</span></div>' +
            '<div><span class="hold-k">Precio actual</span><span class="hold-v tnum">' + precioTxt + '</span></div>' +
            '<div><span class="hold-k">Precio compra</span><span class="hold-v tnum">' + compraTxt + '</span></div>' +
            '<div><span class="hold-k">Ganancia</span><span class="hold-v tnum ' + (difNativo >= 0 ? "pos" : "neg") + '">' + difTxt + (costoNativo > 0 ? " (" + (difNativo>=0?"+":"") + fmtPct(difPct) + "%)" : "") + '</span></div>' +
          '</div>' +
          '<div class="hold-foot">' +
            (h.ticker ? 'Símbolo <b>' + esc(h.ticker.toUpperCase()) + '</b> · ' : '') +
            (h.updatedAt ? 'actualizado ' + esc(h.updatedAt) : 'precio puesto por ti') +
            (extranjera
              ? (tasa != null
                  ? ' · ' + fmtNative(moneda, nativo) + ' × ' + fmtDec(p, tasa, 2) + ' = <b class="tnum">' + fmt(p, valor) + '</b>'
                  : ' · <b class="falta-tasa">falta la tasa de ' + esc(moneda) + '</b>')
              : '') +
          '</div>';
      } else {
        detalle = '<div class="hold-foot">Saldo que tienes guardado en este lugar.</div>';
      }

      return '<div class="hold">' +
        '<div class="row">' +
          '<div class="row" style="gap:8px; min-width:0;">' +
            '<span class="catdot" style="background:' + color + '"></span>' +
            '<div style="min-width:0;">' +
              '<div class="hold-name">' + esc(h.name || KIND_LABEL[h.kind]) + '</div>' +
              '<div class="hold-kind">' + esc(KIND_LABEL[h.kind] || "") + (extranjera ? ' · ' + esc(moneda) : '') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="row" style="gap:4px;">' +
            '<div style="text-align:right;">' +
              '<div class="hold-total tnum">' + fmtSmart(p, valor) + '</div>' +
              (extranjera && tasa != null ? '<div class="hold-native tnum">' + fmtNative(moneda, nativo) + '</div>' : '') +
            '</div>' +
            '<button class="icon-btn" data-edithold="' + h.id + '" title="Editar">✎</button>' +
            '<button class="icon-btn" data-delhold="' + h.id + '" title="Eliminar">✕</button>' +
          '</div>' +
        '</div>' +
        detalle +
      '</div>';
    }).join("");

    // Barra de tasa de cambio: solo aparece si tienes algo en otra moneda
    var monedasExt = usedForeignCurrencies(p);
    var faltantes = missingRates(p);
    var fxHtml = "";
    if(monedasExt.length){
      fxHtml = '<div class="fxbar">' +
        '<div class="fxbar-rows">' +
          monedasExt.map(function(c){
            var r = fxRate(p, c);
            return '<div class="fxrow">' +
              '<span class="fxpair">1 ' + esc(c) + '</span>' +
              '<span class="fxeq">=</span>' +
              '<span class="fxval tnum">' + (r != null ? fmtDec(p, r, 2) : "sin tasa") + '</span>' +
            '</div>';
          }).join("") +
        '</div>' +
        '<div class="fxbar-foot">' +
          '<span>' + (p.fxUpdatedAt ? "Tasa de " + esc(p.fxUpdatedAt) : "Pon la tasa para convertir a tu moneda") + '</span>' +
          '<button class="linkbtn" data-action="edit-fx" style="margin-top:0;">Cambiar a mano</button>' +
        '</div>' +
      '</div>';
    }

    var hayAcciones = p.holdings.some(function(h){ return h.kind === "accion" && h.ticker; });

    return '<div class="stack">' +
      '<div class="card">' +
        '<div class="eyebrow">' + (hayTipos ? "Valor actual de tus ahorros" : "Patrimonio registrado") + '</div>' +
        '<div class="headline tnum">' + fmt(p, totalReferencia) + '</div>' +
        (hayTipos
          ? '<div class="row" style="margin-top:10px; font-size:.82rem;">' +
              '<span>Invertido: <b class="tnum">' + fmt(p, holdCost) + '</b></span>' +
              '<span>Rendimiento: <b class="tnum ' + (rendimiento >= 0 ? "pos" : "neg") + '">' + (rendimiento >= 0 ? "+" : "") + fmt(p, rendimiento) + '</b></span>' +
            '</div>'
          : '<div class="row" style="margin-top:10px; font-size:.82rem;">' +
              '<span>Aportado: <b class="tnum">' + fmt(p,totalSavings) + '</b></span>' +
              '<span>Intereses: <b class="tnum">' + fmt(p,totalInterest) + '</b></span>' +
            '</div>') +
      '</div>' +

      '<div>' +
        '<div class="section-title">Dónde está tu dinero</div>' +
        '<div class="card">' + buildDonut(slices, holdTotal, p) + '</div>' +
      '</div>' +

      '<div>' +
        '<div class="section-title">Tipos de ahorro</div>' +
        (faltantes.length ? '<div class="warncard" style="margin-bottom:12px;">' +
          '<div class="warncard-title">Falta la tasa de ' + faltantes.map(esc).join(", ") + '</div>' +
          '<p>Mientras no la pongas, ese dinero se está sumando al total sin convertir. Toca “Actualizar precios” o escríbela a mano.</p>' +
        '</div>' : '') +
        '<div class="card">' + (tiposHtml || '<div class="empty">Agrega una cuenta, un CDT o una acción para ver aquí tu dinero repartido.</div>') + '</div>' +
        fxHtml +
        '<div class="fab-row">' +
          '<button class="btn block" data-action="add-holding">+ Agregar tipo</button>' +
          (hayAcciones ? '<button class="btn secondary block" data-action="refresh-prices">Actualizar precios</button>' : '') +
        '</div>' +
      '</div>' +

      '<div>' +
        '<div class="section-title">Metas de ahorro</div>' +
        '<div class="card">' + (metasHtml || '<div class="empty">Ponte una meta y mira cuánto te falta.</div>') + '</div>' +
        (p.goals.length ? '<p class="note-line">El avance se mide contra ' + (hayTipos ? "el valor actual de tus tipos de ahorro." : "lo que llevas registrado en movimientos.") + '</p>' : '') +
        '<button class="btn ghost block" style="margin-top:12px;" data-action="add-goal">+ Nueva meta</button>' +
      '</div>' +

      '<div>' +
        '<div class="section-title">Movimientos</div>' +
        '<div class="card">' +
          buildGrowthChart(points) +
          (rows || '<div class="empty">Aún no has registrado aportes ni intereses.</div>') +
        '</div>' +
        '<div class="fab-row">' +
          '<button class="btn secondary block" data-action="add-saving">+ Aporte</button>' +
          '<button class="btn secondary block" data-action="add-interest">+ Interés</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function openAddMoney(kind){
    var p = activeProfile();
    var isSaving = kind === "saving";
    openSheet(
      '<div class="sheet-head"><h3>' + (isSaving ? "Registrar ahorro" : "Registrar interés") + '</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<form id="moneyForm" class="stack">' +
        '<label class="field">Fecha<input type="date" id="mDate" value="' + todayStr() + '" required></label>' +
        '<label class="field">Monto<input type="text" id="mAmount" inputmode="decimal" placeholder="Ej. 200.000" required></label>' +
        '<label class="field">Nota (opcional)<input type="text" id="mNote" maxlength="60" placeholder="' + (isSaving ? "Ej. Traslado a cuenta de ahorros" : "Ej. Rendimiento CDT") + '"></label>' +
        '<button class="btn block" type="submit">Guardar</button>' +
      '</form>'
    );
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    document.getElementById("moneyForm").addEventListener("submit", function(e){
      e.preventDefault();
      var amount = parseNum(document.getElementById("mAmount").value);
      if(!amount || amount <= 0){
        showMessageSheet("Falta el monto", "Escribe el valor. Puedes usar coma para decimales, por ejemplo 200.000 o 200.000,75.");
        return;
      }
      var entry = { id: uid(), date: document.getElementById("mDate").value || todayStr(), amount: amount, note: document.getElementById("mNote").value.trim() };
      (isSaving ? p.savings : p.interest).push(entry);
      saveDB();
      closeSheet();
      currentTab = "ahorros";
      renderApp();
    });
  }

  // ---------- metas ----------
  function openAddGoal(){
    var p = activeProfile();
    openSheet(
      '<div class="sheet-head"><h3>Nueva meta de ahorro</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<form id="goalForm" class="stack">' +
        '<label class="field">¿Para qué ahorras?<input type="text" id="goalName" maxlength="40" placeholder="Ej. Viaje, fondo de emergencia" required></label>' +
        '<label class="field">¿Cuánto quieres reunir?<input type="text" id="goalTarget" inputmode="decimal" placeholder="Ej. 12.000.000" required></label>' +
        '<button class="btn block" type="submit">Crear meta</button>' +
      '</form>'
    );
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    document.getElementById("goalForm").addEventListener("submit", function(e){
      e.preventDefault();
      var name = document.getElementById("goalName").value.trim();
      var target = parseNum(document.getElementById("goalTarget").value);
      if(!name) return;
      if(!target || target <= 0){
        showMessageSheet("Falta el monto de la meta", "Escribe cuánto quieres reunir, por ejemplo 12.000.000.");
        return;
      }
      p.goals.push({ id: uid(), name: name, target: target, createdAt: Date.now() });
      saveDB();
      closeSheet();
      currentTab = "ahorros";
      renderApp();
      showToast('Meta "' + name + '" creada.');
    });
  }

  // ---------- tipos de ahorro ----------
  function holdingFormFields(h){
    h = h || {};
    var kind = h.kind || "cuenta";
    // Un CDT nuevo se asume a plazo fijo; al editar respetamos lo que ya tenga.
    var abiertoSel = h.id ? cdtIsOpen(h) : false;
    return '' +
      '<label class="field">Tipo' +
        '<select id="hKind">' +
          '<option value="cuenta"' + (kind==="cuenta"?" selected":"") + '>Cuenta de ahorros / Efectivo</option>' +
          '<option value="cdt"' + (kind==="cdt"?" selected":"") + '>CDT (a término fijo)</option>' +
          '<option value="accion"' + (kind==="accion"?" selected":"") + '>Acción en bolsa</option>' +
        '</select>' +
      '</label>' +
      '<label class="field">Nombre<input type="text" id="hName" maxlength="30" value="' + esc(h.name || "") + '" placeholder="Ej. Bancolombia, CDT 6 meses, Apple" required></label>' +

      '<div id="campos-cuenta" class="stack kind-fields">' +
        '<label class="field">Saldo actual<input type="text" id="hAmount" inputmode="decimal" value="' + (h.amount != null ? h.amount : "") + '" placeholder="0"></label>' +
      '</div>' +

      '<div id="campos-cdt" class="stack kind-fields">' +
        '<label class="field">Capital invertido<input type="text" id="hPrincipal" inputmode="decimal" value="' + (h.principal != null ? h.principal : "") + '" placeholder="0"></label>' +
        '<label class="field">Tasa de interés anual (E.A. %)<input type="text" id="hRate" inputmode="decimal" value="' + (h.rate != null ? h.rate : "") + '" placeholder="Ej. 11,5"></label>' +
        '<label class="field">Fecha de apertura<input type="date" id="hStart" value="' + esc(h.startDate || todayStr()) + '"></label>' +
        '<label class="field">¿Tiene fecha de vencimiento?' +
          '<select id="hHasTerm">' +
            '<option value="si"' + (!abiertoSel ? " selected" : "") + '>Sí, a plazo fijo</option>' +
            '<option value="no"' + (abiertoSel ? " selected" : "") + '>No, abierto (puedo mover el dinero)</option>' +
          '</select>' +
        '</label>' +
        '<label class="field" id="campo-plazo">Plazo en meses<input type="number" id="hTerm" min="1" step="1" inputmode="numeric" value="' + (h.termMonths != null ? h.termMonths : "") + '" placeholder="Ej. 12"></label>' +
        '<label class="field">Valor actual (opcional)<input type="text" id="hCurrent" inputmode="decimal" value="' + (h.currentValue != null && h.currentValue !== 0 ? h.currentValue : "") + '" placeholder="Déjalo vacío para calcularlo solo"></label>' +
        '<p class="note-line">Si escribes un valor actual, Cuadre usa ese número tal cual — útil cuando el banco te muestra un saldo distinto. Bórralo para volver al cálculo automático con la tasa.</p>' +
      '</div>' +

      '<div id="campos-accion" class="stack kind-fields">' +
        '<label class="field">Símbolo en bolsa<input type="text" id="hTicker" maxlength="12" value="' + esc(h.ticker || "") + '" placeholder="Ej. AAPL, MSFT, TSLA" autocapitalize="characters"></label>' +
        '<label class="field">Cantidad de acciones<input type="text" id="hShares" inputmode="decimal" value="' + (h.shares != null ? h.shares : "") + '" placeholder="Ej. 2,5"></label>' +
        '<label class="field">Precio de compra (por acción)<input type="text" id="hBuy" inputmode="decimal" value="' + (h.buyPrice != null ? h.buyPrice : "") + '" placeholder="Ej. 250,40"></label>' +
        '<label class="field">Precio actual (por acción)<input type="text" id="hPrice" inputmode="decimal" value="' + (h.price != null ? h.price : "") + '" placeholder="Ej. 305,57"></label>' +
        '<label class="field">Moneda en que cotiza<input type="text" id="hCurrency" maxlength="3" autocapitalize="characters" value="' + esc(h.quoteCurrency || "USD") + '" placeholder="USD"></label>' +
        '<p class="note-line">Si pones el símbolo, el botón “Actualizar precios” trae el precio del mercado por ti. ' +
        'Ojo: las acciones de EE. UU. cotizan en dólares, así que ese precio llega en dólares — si tu presupuesto está en otra moneda, conviértelo a mano para que el total tenga sentido.</p>' +
      '</div>';
  }

  function wireKindSwitch(){
    var sel = document.getElementById("hKind");
    function pintar(){
      var k = sel.value;
      ["cuenta","cdt","accion"].forEach(function(x){
        document.getElementById("campos-" + x).style.display = (x === k) ? "flex" : "none";
      });
    }
    sel.addEventListener("change", pintar);
    pintar();

    // El plazo en meses solo tiene sentido si el CDT tiene vencimiento
    var hasTerm = document.getElementById("hHasTerm");
    var campoPlazo = document.getElementById("campo-plazo");
    function pintarPlazo(){
      campoPlazo.style.display = (hasTerm.value === "si") ? "flex" : "none";
    }
    hasTerm.addEventListener("change", pintarPlazo);
    pintarPlazo();
  }

  function openHoldingSheet(existing){
    var p = activeProfile();
    var editando = !!existing;
    openSheet(
      '<div class="sheet-head"><h3>' + (editando ? "Editar tipo de ahorro" : "Agregar tipo de ahorro") + '</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<form id="holdForm" class="stack">' +
        holdingFormFields(existing) +
        '<button class="btn block" type="submit">' + (editando ? "Guardar cambios" : "Agregar") + '</button>' +
      '</form>'
    );
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    wireKindSwitch();
    document.getElementById("holdForm").addEventListener("submit", function(e){
      e.preventDefault();
      var kind = document.getElementById("hKind").value;
      var name = document.getElementById("hName").value.trim();
      if(!name) return;
      var h = existing || { id: uid(), colorIdx: p.holdings.length };
      h.kind = kind;
      h.name = name;

      if(kind === "cuenta"){
        h.amount = parseNum(document.getElementById("hAmount").value);
      } else if(kind === "cdt"){
        h.principal = parseNum(document.getElementById("hPrincipal").value);
        h.rate = parseNum(document.getElementById("hRate").value);
        h.startDate = document.getElementById("hStart").value || todayStr();
        h.openEnded = document.getElementById("hHasTerm").value === "no";
        h.termMonths = h.openEnded ? 0 : parseNum(document.getElementById("hTerm").value);
        h.currentValue = parseNum(document.getElementById("hCurrent").value);
      } else {
        h.ticker = document.getElementById("hTicker").value.trim().toUpperCase();
        h.shares = parseNum(document.getElementById("hShares").value);
        h.buyPrice = parseNum(document.getElementById("hBuy").value);
        h.price = parseNum(document.getElementById("hPrice").value);
        h.quoteCurrency = document.getElementById("hCurrency").value.trim().toUpperCase();
      }

      if(!existing) p.holdings.push(h);
      saveDB();
      closeSheet();
      currentTab = "ahorros";
      renderApp();
      showToast(editando ? "Cambios guardados." : '"' + name + '" agregado.');
    });
  }

  // Trae el precio de mercado. Solo funciona donde la página puede salir a
  // internet (archivo propio o sitio publicado), no dentro del visor de Claude.
  function fetchQuote(ticker){
    var destino = "https://query1.finance.yahoo.com/v8/finance/chart/" +
      encodeURIComponent(ticker) + "?interval=1d&range=1d";
    var url = "https://corsproxy.io/?" + encodeURIComponent(destino);
    var ctrl = new AbortController();
    var corte = setTimeout(function(){ ctrl.abort(); }, 12000);
    return fetch(url, { signal: ctrl.signal })
      .then(function(r){
        clearTimeout(corte);
        if(!r.ok) throw new Error("no encontrado");
        return r.json();
      })
      .then(function(j){
        var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
        var precio = meta && meta.regularMarketPrice;
        if(typeof precio !== "number") throw new Error("sin precio");
        return { price: precio, currency: (meta.currency || "").toUpperCase() };
      });
  }

  function refreshPrices(){
    var p = activeProfile();
    var acciones = p.holdings.filter(function(h){ return h.kind === "accion" && h.ticker; });
    if(!acciones.length){
      showMessageSheet("Sin acciones", "Agrega una acción con su símbolo (por ejemplo AAPL) para poder actualizar precios.");
      return;
    }
    showToast("Consultando precios…");
    var listos = 0, fallidos = [];
    var hoy = new Intl.DateTimeFormat("es", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}).format(new Date());

    Promise.all(acciones.map(function(h){
      return fetchQuote(h.ticker)
        .then(function(q){ h.price = q.price; h.quoteCurrency = q.currency; h.updatedAt = hoy; listos++; })
        .catch(function(){ fallidos.push(h.ticker); });
    })).then(function(){
      // Con los precios ya puestos sabemos en qué monedas están; ahora las tasas.
      return refreshRates(p, hoy);
    }).then(function(tasasOk){
      saveDB();
      renderView();
      if(listos && !fallidos.length){
        showToast((listos === 1 ? "Precio actualizado" : listos + " precios actualizados") +
                  (tasasOk === false ? ", pero no se pudo traer la tasa de cambio." : "."));
      } else if(listos){
        showToast(listos + " actualizados. Sin datos para: " + fallidos.join(", ") + ".");
      } else {
        showMessageSheet("No se pudieron traer los precios",
          "Revisa tu conexión y que los símbolos sean correctos (por ejemplo AAPL). " +
          "Dentro del visor de Claude esta consulta está bloqueada: funciona al abrir la app desde tu archivo o desde tu sitio publicado. " +
          "Mientras tanto puedes escribir el precio a mano editando la acción.");
      }
    });
  }

  // Trae cuántos pesos vale cada moneda extranjera que estés usando
  function refreshRates(p, sello){
    var monedas = usedForeignCurrencies(p);
    if(!monedas.length) return Promise.resolve(true);
    var base = String(p.currencyCode || "COP").toUpperCase();
    var ok = true;
    return Promise.all(monedas.map(function(c){
      return fetchQuote(c + base + "=X")
        .then(function(q){ p.fxRates[c] = q.price; })
        .catch(function(){ ok = false; });
    })).then(function(){
      if(ok) p.fxUpdatedAt = sello || "";
      return ok;
    });
  }

  function openFxSheet(){
    var p = activeProfile();
    var monedas = usedForeignCurrencies(p);
    if(!monedas.length){
      showMessageSheet("Sin monedas extranjeras", "Esto aparece cuando tienes acciones que cotizan en otra moneda.");
      return;
    }
    openSheet(
      '<div class="sheet-head"><h3>Tasa de cambio</h3><button class="icon-btn" id="closeSheet">✕</button></div>' +
      '<p class="sub">¿Cuántos ' + esc(p.currencyCode || "COP") + ' vale hoy una unidad de cada moneda? Sirve para sumar todo en tu moneda.</p>' +
      '<form id="fxForm" class="stack">' +
        monedas.map(function(c){
          var r = p.fxRates[c];
          return '<label class="field">1 ' + esc(c) + ' equivale a<input type="text" inputmode="decimal" data-fx="' + esc(c) + '" value="' + (r != null ? r : "") + '" placeholder="Ej. 4.100"></label>';
        }).join("") +
        '<button class="btn block" type="submit">Guardar tasa</button>' +
        '<button class="btn secondary block" type="button" id="fxAuto">Traerla automáticamente</button>' +
      '</form>'
    );
    document.getElementById("closeSheet").addEventListener("click", closeSheet);
    document.getElementById("fxForm").addEventListener("submit", function(e){
      e.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll("[data-fx]"), function(inp){
        var v = parseNum(inp.value);
        if(v > 0) p.fxRates[inp.dataset.fx] = v;
      });
      p.fxUpdatedAt = "hoy, puesta por ti";
      saveDB();
      closeSheet();
      renderView();
      showToast("Tasa guardada.");
    });
    document.getElementById("fxAuto").addEventListener("click", function(){
      showToast("Consultando la tasa…");
      var sello = new Intl.DateTimeFormat("es", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}).format(new Date());
      refreshRates(p, sello).then(function(ok){
        saveDB();
        closeSheet();
        renderView();
        if(ok) showToast("Tasa actualizada.");
        else showMessageSheet("No se pudo traer la tasa",
          "Puede ser la conexión, o que estés dentro del visor de Claude (ahí las consultas a internet están bloqueadas). Escríbela a mano y listo.");
      });
    });
  }

  // ---------- add category ----------
  function addCategory(p){
    var c = { id: uid(), name: "Nueva categoría", amount: 0, colorIdx: p.catColorSeq || p.categories.length };
    p.catColorSeq = (p.catColorSeq || p.categories.length) + 1;
    p.categories.push(c);
    saveDB();
    renderView();
    requestAnimationFrame(function(){
      var input = document.querySelector('.cat-name[data-id="' + c.id + '"]');
      if(input){ input.focus(); input.select(); }
    });
  }

  // ---------- event binding ----------
  function bindViewEvents(){
    var view = document.getElementById("view");
    var p = activeProfile();

    view.onclick = function(e){
      var goto = e.target.closest("[data-goto]");
      if(goto){ currentTab = goto.dataset.goto; renderView(); return; }

      var action = e.target.closest("[data-action]");
      if(action){
        var a = action.dataset.action;
        if(a === "add-expense") openAddExpense();
        else if(a === "add-category") addCategory(p);
        else if(a === "add-saving") openAddMoney("saving");
        else if(a === "add-interest") openAddMoney("interest");
        else if(a === "prev-month"){ uiMonth = ymAdd(uiMonth, -1); renderView(); }
        else if(a === "next-month"){ uiMonth = ymAdd(uiMonth, 1); renderView(); }
        else if(a === "export") exportAllData();
        else if(a === "export-text") showBackupAsText();
        else if(a === "import-text") openPasteImport();
        else if(a === "import"){ document.getElementById("importFile").click(); }
        else if(a === "add-goal") openAddGoal();
        else if(a === "add-holding") openHoldingSheet(null);
        else if(a === "refresh-prices") refreshPrices();
        else if(a === "edit-fx") openFxSheet();
        else if(a === "add-debt-debo") openAddDebt("debo");
        else if(a === "add-debt-prestado") openAddDebt("prestado");
        else if(a === "add-income") openAddIncome();
        else if(a === "add-recurring") openAddRecurring();
        return;
      }

      var delinc = e.target.closest("[data-delincome]");
      if(delinc){
        p.incomes = p.incomes.filter(function(x){ return x.id !== delinc.dataset.delincome; });
        saveDB(); renderView(); return;
      }

      var delrec = e.target.closest("[data-delrec]");
      if(delrec){
        var rid = delrec.dataset.delrec;
        var rec = null;
        for(var ri=0; ri<p.recurring.length; ri++){ if(p.recurring[ri].id === rid) rec = p.recurring[ri]; }
        askConfirm({
          title: "Quitar recurrente",
          body: 'Dejará de registrarse solo cada periodo. Los gastos que ya registró se quedan en tu historial.',
          confirmLabel: "Quitar",
          danger: true,
          onConfirm: function(){
            p.recurring = p.recurring.filter(function(x){ return x.id !== rid; });
            saveDB(); renderView();
            showToast(rec ? '"' + rec.name + '" ya no es recurrente.' : "Listo.");
          }
        });
        return;
      }

      var pay = e.target.closest("[data-paydebt]");
      if(pay){ openPayDebt(pay.dataset.paydebt); return; }

      var deldebt = e.target.closest("[data-deldebt]");
      if(deldebt){
        var did = deldebt.dataset.deldebt;
        var deuda = null;
        for(var di=0; di<p.debts.length; di++){ if(p.debts[di].id === did) deuda = p.debts[di]; }
        askConfirm({
          title: "Eliminar registro",
          body: 'Se borrará la deuda de ' + (deuda ? deuda.person : "") + ' y sus pagos. Esta acción no se puede deshacer.',
          confirmLabel: "Eliminar",
          danger: true,
          onConfirm: function(){
            p.debts = p.debts.filter(function(x){ return x.id !== did; });
            saveDB(); renderView();
          }
        });
        return;
      }

      var delcat = e.target.closest("[data-delcat]");
      if(delcat){
        var id = delcat.dataset.delcat;
        var cat = getCategory(p, id);
        var hasExp = p.expenses.some(function(ex){ return ex.categoryId === id; });
        var removeCat = function(){
          p.categories = p.categories.filter(function(c){ return c.id !== id; });
          saveDB();
          renderView();
        };
        if(hasExp){
          askConfirm({
            title: "Eliminar " + (cat ? cat.name : "categoría"),
            body: "Tiene gastos registrados. Si la eliminas, esos gastos seguirán contando en tu total del mes, pero aparecerán como “Sin categoría”.",
            confirmLabel: "Eliminar categoría",
            danger: true,
            onConfirm: removeCat
          });
          return;
        }
        removeCat();
        return;
      }

      var delgoal = e.target.closest("[data-delgoal]");
      if(delgoal){
        var gid = delgoal.dataset.delgoal;
        var goal = null;
        for(var gi=0; gi<p.goals.length; gi++){ if(p.goals[gi].id === gid) goal = p.goals[gi]; }
        askConfirm({
          title: "Eliminar meta",
          body: 'Se quitará la meta "' + (goal ? goal.name : "") + '". Tus ahorros no se tocan.',
          confirmLabel: "Eliminar meta",
          danger: true,
          onConfirm: function(){
            p.goals = p.goals.filter(function(g){ return g.id !== gid; });
            saveDB(); renderView();
          }
        });
        return;
      }

      var edithold = e.target.closest("[data-edithold]");
      if(edithold){
        var hid = edithold.dataset.edithold;
        for(var hi=0; hi<p.holdings.length; hi++){
          if(p.holdings[hi].id === hid){ openHoldingSheet(p.holdings[hi]); break; }
        }
        return;
      }

      var delhold = e.target.closest("[data-delhold]");
      if(delhold){
        var hid2 = delhold.dataset.delhold;
        var hold = null;
        for(var hj=0; hj<p.holdings.length; hj++){ if(p.holdings[hj].id === hid2) hold = p.holdings[hj]; }
        askConfirm({
          title: "Eliminar " + (hold ? hold.name : "tipo de ahorro"),
          body: "Se quitará de tu distribución de ahorros. Tus movimientos registrados no se tocan.",
          confirmLabel: "Eliminar",
          danger: true,
          onConfirm: function(){
            p.holdings = p.holdings.filter(function(h){ return h.id !== hid2; });
            saveDB(); renderView();
          }
        });
        return;
      }

      var delexp = e.target.closest("[data-delexp]");
      if(delexp){
        p.expenses = p.expenses.filter(function(x){ return x.id !== delexp.dataset.delexp; });
        saveDB(); renderView(); return;
      }
      var delsav = e.target.closest("[data-delsav]");
      if(delsav){
        p.savings = p.savings.filter(function(x){ return x.id !== delsav.dataset.delsav; });
        saveDB(); renderView(); return;
      }
      var delint = e.target.closest("[data-delint]");
      if(delint){
        p.interest = p.interest.filter(function(x){ return x.id !== delint.dataset.delint; });
        saveDB(); renderView(); return;
      }
    };

    view.oninput = function(e){
      if(e.target.id === "cycle-day"){
        var dia = Math.round(Number(e.target.value) || 1);
        p.cycleStartDay = clamp(dia, 1, 31);
        saveDB();
        renderView();
        requestAnimationFrame(function(){
          var campo = document.getElementById("cycle-day");
          if(campo){ campo.focus(); campo.select(); }
        });
        return;
      }
      if(e.target.id === "budget-input"){
        p.budget = parseNum(e.target.value);
        rememberBudget(p);
        saveDB();
        refreshBudgetComputed(p);
        return;
      }
      if(e.target.classList.contains("cat-amount")){
        var cat = getCategory(p, e.target.dataset.id);
        if(cat){
          cat.amount = Math.max(0, parseNum(e.target.value));
          saveDB();
          refreshBudgetComputed(p);
        }
        return;
      }
      if(e.target.classList.contains("cat-name")){
        var cat2 = getCategory(p, e.target.dataset.id);
        if(cat2){ cat2.name = e.target.value; saveDB(); }
        return;
      }
    };

    view.onchange = function(e){
      if(e.target.id === "importFile"){
        var file = e.target.files && e.target.files[0];
        if(file) handleImportFile(file);
        e.target.value = "";
      }
    };
  }

  migrateAll();
  renderApp();
})();
</script>
